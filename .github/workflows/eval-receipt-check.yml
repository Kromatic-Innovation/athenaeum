name: Eval Receipt Check

# athenaeum#1731: evals.yml's `eval` job runs on manual workflow_dispatch
# only (operator decision 2026-09-16, docs/design/native-memory-baseline.md
# §9) — nothing runs it automatically when a PR touches an LLM-facing
# module. This workflow is the token-free half that closes the gap: it
# notices when a PR touches the LLM surface (`.github/llm-surface.txt`,
# the ONE list this workflow and `tests/test_llm_surface.py` both read)
# and requires either a receipt pointing at a matching dispatched run of
# the `Evals` workflow (evals.yml) that concluded `success`, or an explicit
# "not needed" line — see `scripts/check_llm_surface_receipt.py` for the
# full decision logic and `tests/evals/README.md` for the receipt line's
# documented format.
#
# Deliberately NOT path-filtered: an `on.pull_request.paths` block would be
# a second copy of the surface list, and — worse — a path-filtered job that
# does not run reports no status at all, which for a gating check is
# indistinguishable from "passed." Instead this job always runs and the
# script decides: an empty intersection with the surface list is a
# trivial pass (see AC3's docs-only-PR case).
#
# `types: [opened, synchronize, reopened, edited]` — `edited` matters here
# specifically: adding the `Evals:` receipt line to an already-open PR is a
# body edit, not a new commit, and without `edited` in this list the check
# would never re-run to pick it up.
#
# Zero network beyond `gh` reads against the default `GITHUB_TOKEN` — no
# Anthropic key, no push trigger, evals.yml's own triggers untouched.
#
# Status: BLOCKING in practice. It is its own workflow file, not folded into
# ci.yml's `ci-required` aggregate (embedding-pr.yml's convention,
# athenaeum#1609), so the branch ruleset does not list it — but the merge
# wrapper (code-workspace-config scripts/gh-orch-pr-merge.sh) waits on EVERY
# check on the head and refuses to merge when any one fails, this one
# included. Treat a red here as a merge blocker.
#
# A receipt is matched on content, not on the exact head commit: a run at an
# earlier commit still counts when no LLM-surface file differs between it and
# the head (see the script's docstring), so an update-branch, the wrapper's
# version bump or a rebase does not demand a fresh paid eval dispatch.
#
# THE GATE RUNS FROM THE BASE COMMIT (athenaeum#2227, design §5.6). This job
# used to run `python scripts/check_llm_surface_receipt.py` straight out of the
# `pull_request` checkout, which means a PR's OWN copy of the script decided
# that PR. Since the merge wrapper treats any failed check as blocking, the
# gate matters — and a one-line edit to the script in the same PR would have
# bypassed it. So the script (and every repo-local file it imports) is
# materialised from `github.event.pull_request.base.sha` with `git show` and
# run from `$RUNNER_TEMP`, so a PR's gate changes only take effect after they
# merge. The PR's own surface list is still what the gate reads for the HEAD
# designations; the merge base's copy is passed alongside it, because FIRE and
# COVERS use the union of both ends (design §5.4).
#
# Bootstrap: a base commit that predates the script falls back to the head
# copy with a `::warning::`. `tests/test_eval_receipt_gate_from_base.py` runs
# this step's own shell body against throwaway repos, so the recipe is tested
# rather than described.
#
# Third-party actions pinned to full commit SHAs for supply-chain hygiene,
# matching ci.yml's convention.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least-privilege: read-only checkout plus a read of the PR body via `gh`.
permissions:
  contents: read
  pull-requests: read

jobs:
  eval-receipt:
    name: LLM surface touched -> eval receipt required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Nothing in this job pushes or needs an authenticated git remote
          # (the `gh` calls below use GH_TOKEN directly, not the checkout's
          # credential helper) — least-privilege per Quine's athenaeum#1745 review.
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Fetch PR body
        # Read via `gh` into a file rather than interpolating
        # `${{ github.event.pull_request.body }}` into a `run:` block —
        # this is a public repo, and arbitrary PR-body text landing in a
        # shell string is a script-injection surface. `gh pr view` needs
        # only the default GITHUB_TOKEN's `pull-requests: read` scope.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json body -q .body > pr-body.txt

      - name: Materialise the gate from the PR's base commit
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # EVERY repo-local file the gate needs, not just the entry script —
          # a helper module taken from the PR's checkout would reopen exactly
          # the hole this step closes. The list is pinned against the script's
          # own imports by tests/test_eval_receipt_gate_from_base.py, so adding
          # a helper module without adding it here fails CI.
          GATE_FILES="scripts/check_llm_surface_receipt.py"
          GATE_DIR="$RUNNER_TEMP/gate"
          mkdir -p "$GATE_DIR"
          missing=0
          for f in $GATE_FILES; do
            mkdir -p "$GATE_DIR/$(dirname "$f")"
            if ! git show "$BASE_SHA:$f" > "$GATE_DIR/$f" 2>/dev/null; then
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::warning::the base commit $BASE_SHA does not carry the eval-receipt gate; falling back to this PR's own copy (bootstrap only)"
            for f in $GATE_FILES; do
              mkdir -p "$GATE_DIR/$(dirname "$f")"
              cp "$f" "$GATE_DIR/$f"
            done
          fi
          # The merge base's surface list, for the union rule. `|| true`: a
          # shallow or missing merge base is not fatal — the gate falls back to
          # the head designations, which is coarser, never weaker.
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          if [ -n "$MERGE_BASE" ] && git show "$MERGE_BASE:.github/llm-surface.txt" > "$GATE_DIR/base-llm-surface.txt" 2>/dev/null; then
            echo "base_surface=$GATE_DIR/base-llm-surface.txt" >> "$GITHUB_OUTPUT"
          fi
          echo "script=$GATE_DIR/scripts/check_llm_surface_receipt.py" >> "$GITHUB_OUTPUT"

      - name: Check LLM surface + eval receipt
        env:
          # `scripts/check_llm_surface_receipt.py` shells out to `gh run
          # view` when a receipt URL is present, to verify the dispatched
          # run's headSha/event — same default-token read as the PR-body
          # fetch above.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_SCRIPT: ${{ steps.gate.outputs.script }}
          BASE_SURFACE: ${{ steps.gate.outputs.base_surface }}
        run: |
          set -euo pipefail
          # The BASE copy of the script, from $RUNNER_TEMP — never
          # `scripts/check_llm_surface_receipt.py` out of this checkout.
          args=(
            --surface-file .github/llm-surface.txt
            --base-sha "${{ github.event.pull_request.base.sha }}"
            --head-sha "${{ github.event.pull_request.head.sha }}"
            --pr-body-file pr-body.txt
            --repo "${{ github.repository }}"
          )
          # Only pass the base surface list if the BASE copy of the script
          # understands the flag — during the rollout the base commit may
          # predate it, and an unknown flag would fail the gate rather than
          # check it.
          if [ -n "$BASE_SURFACE" ] && grep -q -- "--base-surface-file" "$GATE_SCRIPT"; then
            args+=(--base-surface-file "$BASE_SURFACE")
          fi
          python "$GATE_SCRIPT" "${args[@]}"
