name: CI

# Third-party actions pinned to full commit SHAs for supply-chain hygiene.
# Semver-tag comment after each pin records the release the SHA maps to at
# pin time. Keep in sync with release.yml pins.
#
# athenaeum#1160 restores `push: [develop]` alongside `pull_request`, reversing
# athenaeum#1031 (epic cwc#2251), which had dropped it because every
# post-merge push run was a full duplicate of the PR run that had just tested
# the identical tree. That regression is why promote-main.yml's `CI Required`
# gate had to grow a PR-head fallback (cwc#2627) instead of just reading the
# develop tip's own check-run — no push run ever stamped one. Rather than
# leave that workaround as the permanent shape, this restores the tip-level
# check-run the direct way: `push` triggers a run, and a `check_duplicate` job
# (below) short-circuits it to a cheap no-op whenever the tree was already
# tested on the PR head, so the tip gets its own `CI Required` conclusion
# without paying for a second full matrix. The short-circuit mechanism
# (`scripts/ci-key.sh` + `ci-attestation-gate.sh`, falling back to
# `ci-detect-merged-pr.sh`) is ported unmodified from hestia, which piloted it
# as cwc#2755. `main` still never runs its own CI: it is fast-forward-promoted
# from develop by promote-main.yml, which re-verifies the required check-runs
# before pushing the ref update, and `main`'s tip is always the same commit
# SHA that develop already tested.

# `workflow_dispatch` (athenaeum#1159) exists so a develop SHA can be stamped
# with a `CI Required` check-run on demand — kept as an independently useful
# manual escape hatch even now that `push` normally does this automatically
# (for example immediately after this workflow file itself changes, before any
# push has landed under the new trigger). `check_duplicate`'s duplicate
# detection only ever fires on a `push` event (see `ci-detect-merged-pr.sh`),
# so a dispatch run always executes the full suite.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

# Cancel a superseded run when a newer commit lands on the same ref (M23,
# hestia#548). Keyed on workflow + ref so runs for different pull requests
# stay independent, but stacked pushes to the same PR cancel the in-flight
# run instead of queueing a duplicate 3-leg matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (Scorecard Token-Permissions, athenaeum#405). CI only reads
# the repo and runs tests, so `contents: read` is sufficient; jobs that need
# more can widen this at the job level.
permissions:
  contents: read

jobs:
  # athenaeum#1160 — decide whether this push's tree was already tested green,
  # so the jobs below can skip a redundant re-run. Two independent dedup
  # paths, tried in order, sharing one `skip` output:
  #
  #   1. attestation (scripts/ci-attestation-gate.sh + ci-key.sh) — has THIS
  #      TREE been tested green? Reaches squash and rebase merges, and
  #      different commits with identical trees.
  #   2. merge-commit detector (scripts/ci-detect-merged-pr.sh) — is this push
  #      the merge commit of a PR that already passed? Fallback for a key
  #      miss; needs no attestation to exist.
  #
  # `pull-requests: read` and `checks: read` are granted at JOB level (not
  # file level) so every other job stays on `contents: read` alone — the
  # file-level `permissions:` above sets every unnamed scope to `none`, and a
  # 403 from a missing scope must never be read as "not merged"/"not
  # attested" (see the scripts' headers for the measured failure mode this
  # guards against).
  check_duplicate:
    name: Check for duplicate CI run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The content-addressed key for the tree actually checked out. On a
      # `pull_request` event that is the merge preview, which is the tree a
      # squash or rebase merge will produce on `develop`; that is what makes
      # an attestation published from a PR run reusable by the push run that
      # follows the merge.
      - name: Compute CI key
        id: key
        run: |
          CI_KEY="$(bash scripts/ci-key.sh HEAD)"
          echo "CI key for $GITHUB_SHA: $CI_KEY"
          echo "key=$CI_KEY" >> "$GITHUB_OUTPUT"

      - name: Detect a redundant run
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          # `head_commit` exists on push events, `pull_request.title` on PRs,
          # so the `[ci force]` escape hatch works from either.
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          CI_KEY: ${{ steps.key.outputs.key }}
        run: |
          set -uo pipefail
          verdict="$(mktemp)"

          FORCE_HAYSTACK="$HEAD_COMMIT_MSG
          $PR_TITLE"

          bash scripts/ci-attestation-gate.sh \
            --repo "${{ github.repository }}" \
            --key "$CI_KEY" \
            --commit-message "$FORCE_HAYSTACK" \
            --output "$verdict"

          if grep -qx 'skip=true' "$verdict"; then
            cat "$verdict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "--- no usable attestation; falling back to the merge-commit detector."
          : > "$verdict"
          bash scripts/ci-detect-merged-pr.sh \
            --event-name "${{ github.event_name }}" \
            --repo "${{ github.repository }}" \
            --commit-message "$HEAD_COMMIT_MSG" \
            --output "$verdict"
          cat "$verdict" >> "$GITHUB_OUTPUT"

  # The suite runs as a matrix of runner shards, each running its slice under
  # pytest-xdist, so the job's wall clock is set by the slowest shard rather
  # than one 4-vCPU runner (athenaeum#2230 measured ~2x effective parallelism
  # per runner). tests/ci_sharding.py assigns every collected test to exactly
  # one shard, deterministically, keeping each xdist work unit whole. The
  # `coverage` job below checks that the shards' selected counts sum to the
  # collected total, then combines their coverage data and enforces the 75%
  # floor. To change the shard count, edit `shard:` only; every leg reads the
  # total from `strategy.job-total`.
  test:
    name: test (shard ${{ matrix.shard }})
    needs: [check_duplicate]
    if: needs.check_duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      # A failing shard must not cancel its siblings: their own failures
      # would then be hidden behind `cancelled`. `needs.test.result` is
      # `failure` either way, so the gate is unaffected.
      fail-fast: false
      matrix:
        # 2, measured against 3 and 4 on real runs: all three finished in
        # ~8m25s, because each shard pays ~2.5 min of install + collection
        # and the test_recall_covers_grep.py `core` unit (~4.5-5.5 min) sets
        # the floor wherever it lands. More shards only add runners until
        # that unit gets cheaper.
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          # Reuse downloaded wheels across runs; keyed on both dependency
          # manifests so a lock or range change starts a fresh cache.
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.lock

      - name: Install dependencies (with vector extras)
        run: |
          python -m pip install --upgrade pip
          # Pin the transitive tree for reproducible CI (athenaeum#556). The lock
          # is applied as a CONSTRAINTS file: pyproject.toml still resolves the
          # graph per Python version, then each package is pinned to the locked
          # version. pyproject's published ranges are unchanged.
          pip install -e ".[dev,vector]" -c requirements-ci.lock

      - name: Lint with ruff
        run: ruff check src/ tests/

      # Parallel across the runner's cores via pytest-xdist. `loadfile`, not
      # `load`/`worksteal`: several modules build an expensive MODULE-scoped
      # fixture (tests/evals/test_recall_covers_grep.py's index build,
      # test_hook_byte_equivalence_1912.py's 48-probe comparison), and
      # spreading one module's tests across workers would rebuild it on each.
      # tests/conftest.py's `pytest_xdist_make_scheduler` additionally splits
      # test_recall_covers_grep.py by its `scale` param, its slowest module.
      # `--ci-shard` keeps only this leg's slice; `--ci-shard-report` records
      # the collected/selected counts the `coverage` job cross-checks.
      #
      # The one test deselected here runs serially in shard 1's next step
      # instead: it races a 20ms heartbeat thread and fails under 4-way CPU
      # contention (athenaeum#2229, a product-side read-during-rewrite race),
      # while never failing serially.
      - name: Run tests
        run: pytest tests/ -n auto --dist loadfile -v --tb=short --durations=30 --cov=athenaeum --cov-report= --ci-shard ${{ matrix.shard }}/${{ strategy.job-total }} --ci-shard-report ci-shard-report.json --deselect tests/test_runlock.py::TestLockHeldMessageDetail::test_message_reports_last_heartbeat_age_after_a_bump

      # Appends to this shard's coverage data before it is uploaded.
      - name: Run contention-sensitive tests serially
        if: matrix.shard == 1
        run: pytest tests/test_runlock.py::TestLockHeldMessageDetail::test_message_reports_last_heartbeat_age_after_a_bump -v --tb=short --cov=athenaeum --cov-append --cov-report=

      # `.coverage` is a dotfile, which upload-artifact skips by default, so
      # it is renamed to a per-shard name that also cannot collide when the
      # `coverage` job downloads every shard into one directory.
      - name: Stage shard coverage data
        run: |
          mkdir -p shard-out
          mv .coverage "shard-out/coverage.shard-${{ matrix.shard }}"
          mv ci-shard-report.json "shard-out/report.shard-${{ matrix.shard }}.json"

      - name: Upload shard coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-shard-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: error
          retention-days: 3

  # Combines the shards: proves every collected test ran in exactly one shard,
  # then merges their coverage data and enforces the 75% floor that the
  # single-runner job used to enforce itself. Runs only when every shard
  # passed (explicit `needs.test.result == 'success'`, because `success()` is
  # also true for a skipped need). `CI Required` treats this job's skip as
  # green only when `test` itself was skipped by the dedup.
  coverage:
    name: Coverage (combined shards)
    needs: [check_duplicate, test]
    if: needs.check_duplicate.outputs.skip != 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install coverage (locked version)
        run: |
          python -m pip install --upgrade pip
          pip install coverage -c requirements-ci.lock

      - name: Download shard coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ci-shard-*
          path: shard-data
          merge-multiple: true

      - name: Every collected test ran in exactly one shard
        run: |
          python - <<'EOF'
          import json, pathlib
          reports = [json.loads(p.read_text()) for p in sorted(pathlib.Path("shard-data").glob("report.shard-*.json"))]
          for r in reports:
              print(r)
          shards = {r["shard"] for r in reports}
          totals = {r["total_shards"] for r in reports}
          collected = {r["collected"] for r in reports}
          assert len(totals) == 1, f"shards disagree on the shard count: {totals}"
          (n,) = totals
          assert shards == set(range(1, n + 1)) and len(reports) == n, f"expected reports for shards 1..{n}, got {sorted(shards)}"
          assert len(collected) == 1, f"shards collected different suites: {collected}"
          (total,) = collected
          selected = sum(r["selected"] for r in reports)
          assert selected == total, f"shards selected {selected} tests but {total} were collected"
          print(f"OK: {n} shards selected {selected} of {total} collected tests, each exactly once")
          EOF

      - name: Combine coverage and enforce the 75% floor
        run: |
          coverage combine shard-data/coverage.shard-*
          coverage report --show-missing --fail-under=75

  # hestia#596 — BLOCKING type check. The package ships `py.typed` (a PEP 561
  # assertion of type correctness to downstream consumers); mypy now enforces
  # that assertion. The backlog that hestia#550 sized (and the two systemic
  # slices athenaeum#594/#595 plus athenaeum#596 cleared) is empty, so this job is wired into
  # `CI Required` (`needs: [test, types]` below) and the mypy step is no longer
  # `continue-on-error` — a type regression now gates merge and `main`
  # promotion. Runs on a single Python version — mypy is Python-version-agnostic
  # here (`python_version = "3.13"` is pinned in `[tool.mypy]`).
  types:
    name: Types (mypy)
    needs: [check_duplicate]
    if: needs.check_duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies (with type extras)
        run: |
          python -m pip install --upgrade pip
          # Same reproducible-CI lock (athenaeum#556); the `types`-only extras
          # (mypy + stubs) resolve unpinned since the lock tracks [dev,vector].
          pip install -e ".[dev,vector,types]" -c requirements-ci.lock

      - name: Type check with mypy
        run: mypy

  # athenaeum#2136 — the CONTRIBUTOR's install path, with NO
  # `requirements-ci.lock`. Every other job here constrains to that lock, which
  # is the right call for reproducibility but means the published, unconstrained
  # ranges in pyproject.toml are never actually resolved by CI. That blind spot
  # shipped a real break: four test modules `import httpx`, `httpx` was declared
  # nowhere, and it arrived only as a transitive of `anthropic` — so when
  # `anthropic` 1.17.0 switched to `httpx2`, a clean `pip install -e ".[dev]"`
  # stopped collecting the suite (3 ERRORs, 0 tests run) while CI stayed green
  # on the locked older `anthropic`. The first person to see it was a release
  # reviewer bootstrapping the project from CONTRIBUTING.md.
  #
  # Deliberately NOT a second full matrix leg: `test` already covers "does the
  # suite pass", sharded across runners. This job answers the narrower question "can the
  # documented install still RUN the suite at all", in about two — collection of
  # everything, plus a smoke subset of the modules that touch the third-party
  # dependency surface directly, plus the declared-imports check that names an
  # undeclared dependency instead of letting it surface as a downstream
  # ImportError.
  clean-venv:
    name: Clean venv (unconstrained ranges)
    needs: [check_duplicate]
    if: needs.check_duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # `[dev]` only, and NO `-c requirements-ci.lock` — this is verbatim what
      # CONTRIBUTING.md step 2 offers a contributor who is not touching search
      # or clustering. Adding the lock here, or widening the extras to match the
      # `test` job, would delete the entire point of this job.
      - name: Install the documented contributor path (no lock)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The resolved tree, in the log, so a future drift of this kind is one
      # click from a diagnosis instead of a bisect.
      - name: Record the resolved dependency tree
        run: pip freeze

      - name: Every third-party import is declared
        run: python scripts/check_declared_imports.py

      # Collection is the bar the `httpx` break actually failed. It runs the
      # whole suite's imports in seconds and needs no optional extra.
      - name: The whole suite still collects
        run: pytest tests/ --collect-only -q

      # The modules that import the third-party dependency surface directly
      # (`httpx` in the first four, `packaging` in the next two), the two checks
      # that police declarations and the environment contract, and the public
      # API surface. ATHENAEUM_TEST_ENV_CONTRACT=strict promotes an
      # environment-contract skip (tests/env_contract.py) into a FAILURE, so a
      # missing dependency cannot hide behind "skipped" here — which means every
      # test listed below has to satisfy the contract properties a `[dev]`-only
      # install provides. Do not add a test that needs `[vector]`.
      - name: Dependency-surface smoke subset
        env:
          ATHENAEUM_TEST_ENV_CONTRACT: strict
        run: |
          pytest -q \
            tests/test_retry.py \
            tests/test_retry_registry.py \
            tests/test_batch_mode.py \
            tests/test_librarian_zero_yield.py \
            tests/test_ci_lock_parity.py \
            tests/test_cli_tool_bridge_mcp_api_guard.py \
            tests/test_declared_imports.py \
            tests/test_env_contract.py \
            tests/test_clean_venv_ci_wiring.py \
            tests/test_public_api.py

  # athenaeum#693 — org-agnostic public-safety leak scan, folded into the
  # required `CI Required` gate below (added to `needs:` + checked in the
  # aggregate) so a hit BLOCKS merge/promotion rather than being advisory, and
  # WITHOUT any new branch protection. The standalone `public-safe-lint.yml`
  # workflow additionally covers fork PRs (which receive no secrets); this job
  # is what makes the check part of this repo's required status set — the same
  # adoption shape as ideate-core#118/#119. Uses the canonical scanner from
  # code-workspace-config, unmodified (`bash public-safe-lint.sh .`); it carries
  # no org-specific data and needs no secret, so it runs identically here and on
  # a fork PR. Per-repo exemptions live in `.public-safe-lintignore` (path+rule
  # only), never in the scanner.
  public-safe-lint:
    name: Public-safe lint (org-agnostic leak shapes)
    needs: [check_duplicate]
    if: needs.check_duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run public-safe-lint scan
        run: bash public-safe-lint.sh .

  # athenaeum#2297 — prove the documented uv install path actually clears the
  # "pip silently resolves backwards on an old interpreter" trap that
  # README.md and docs/guides/install.md warn about, on exactly the
  # interpreter pip gets this wrong on: ubuntu-latest's own default `python3`
  # (3.12 as of this writing — predates the 3.13 floor). The first step below
  # fails loudly, not silently, the day that stops being true.
  #
  # Deliberately its own job, NOT added to `ci-required`'s `needs:` below: it
  # depends on live PyPI (`uv tool install`) and uv's own installer download,
  # and a transient network blip there must never block a merge or main
  # promotion. A real regression still shows up as a visible red check.
  docs-uv-install-path:
    name: Docs install path (uv, pre-3.13 default interpreter)
    needs: [check_duplicate]
    if: needs.check_duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Assert this runner's default python3 predates 3.13
        run: |
          python3 -c '
          import sys
          v = sys.version_info[:2]
          print(f"Default python3 on this runner: {v[0]}.{v[1]}")
          if v >= (3, 13):
              print(
                  "::error::ubuntu-latest default python3 is now >= 3.13 - "
                  "this job no longer exercises the pre-3.13 scenario it is "
                  "named for. Update or retire it rather than letting it "
                  "pass silently."
              )
              raise SystemExit(1)
          '

      # AC4 counter-example: pip, run under this same pre-3.13 default
      # interpreter, resolving the documented `athenaeum[mcp]` extra.
      # Informational only — this step never fails the job either way (see
      # the printed message for why): what must fail the job is the *uv*
      # path below resolving below the floor, not pip's live behaviour,
      # which can legitimately change out from under this job as old
      # releases age further past PyPI's resolver window.
      - name: "Control: pip under the default interpreter"
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pip-control-venv
          /tmp/pip-control-venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/pip-control-venv/bin/python -m pip install --quiet packaging
          /tmp/pip-control-venv/bin/python -m pip install --quiet 'athenaeum[mcp]'
          RESOLVED="$(/tmp/pip-control-venv/bin/athenaeum --version | awk '{print $NF}')"
          echo "pip resolved under $(python3 --version): $RESOLVED"
          /tmp/pip-control-venv/bin/python -c "
          from packaging.version import Version
          resolved = Version('$RESOLVED')
          floor = Version('0.17.1')
          if resolved < floor:
              print(f'pip still resolves below the documented floor ({resolved} < {floor}) - the wrong-interpreter bug this issue documents still reproduces under pip.')
          else:
              print(f'pip now resolves at/above the documented floor ({resolved} >= {floor}) - pip behaviour under this interpreter has changed since this job was written; the warning in README.md / docs/guides/install.md stays documented regardless.')
          "

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The AC3 command itself, verbatim from README.md / docs/guides/install.md.
      - name: Run the documented uv install command
        run: uv tool install --python 3.13 'athenaeum[mcp]'

      # "a shell with no venv active": no venv is created or activated in
      # this job; `athenaeum` reaches PATH only via the shim directory `uv
      # tool install` wrote to and the step above added to PATH — exactly
      # like a fresh machine following the docs.
      - name: Assert the uv-installed version meets the documented floor
        run: |
          set -euo pipefail
          RESOLVED="$(athenaeum --version | awk '{print $NF}')"
          echo "uv tool install resolved: $RESOLVED"
          uv run --no-project --with packaging -- python3 -c "
          from packaging.version import Version
          resolved = Version('$RESOLVED')
          floor = Version('0.17.1')
          if resolved < floor:
              raise SystemExit(
                  f'uv tool install resolved {resolved}, below the documented '
                  f'floor {floor} - the uv path has regressed to the same '
                  'wrong-interpreter behaviour pip has.'
              )
          print(f'OK: uv tool install resolved {resolved} >= floor {floor}')
          "

      - name: Run athenaeum test-mcp with no venv active
        run: athenaeum test-mcp

  # athenaeum#1160 — publish the green-CI attestation for the tree that was
  # just tested, so the next commit carrying an identical tree (a squash
  # merge, a rebase, a develop push whose tree a PR already tested) can reuse
  # this evidence instead of paying for it again. The condition is spelled out
  # rather than `if: success()`, because `success()` is also true when a
  # needed job was SKIPPED — exactly the dedup-hit case, where there is
  # nothing new to attest. Deliberately NOT in `ci-required`'s `needs` (that
  # job is otherwise byte-unchanged by this): publishing is an optimisation, a
  # failure here must cost a future CI saving, never a merge.
  publish_attestation:
    name: Publish CI attestation
    needs: [check_duplicate, test, coverage, types, public-safe-lint, clean-venv]
    if: >-
      needs.check_duplicate.result == 'success' &&
      needs.test.result == 'success' &&
      needs.coverage.result == 'success' &&
      needs.types.result == 'success' &&
      needs.public-safe-lint.result == 'success' &&
      needs.clean-venv.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The ref must point at the commit GitHub stamped with the check-runs,
      # because that stamp is what the gate's first verification reads. On a
      # `pull_request` event that is the PR HEAD, not `$GITHUB_SHA` (the merge
      # preview `refs/pull/N/merge`, which carries no check-runs at all).
      - name: Publish attestation ref
        env:
          CI_KEY: ${{ needs.check_duplicate.outputs.key }}
          PROVING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/ci-attestation-publish.sh \
            --key "$CI_KEY" \
            --sha "$PROVING_SHA"

  # hestia#557 — a single, always-present aggregate status that is intended to
  # be the ONE required check on develop/main. It runs on every event
  # (`if: always()`) so it reports a concrete conclusion instead of vanishing
  # when an upstream job is skipped/cancelled. Making the matrix `test` job
  # itself required would name per-leg checks (`test (3.11)` …) and would wedge
  # on any run where a leg is absent, since a missing required check never
  # resolves. This synthesized gate is the single required check instead.
  #
  # athenaeum#1160 — `test`/`types`/`public-safe-lint` can now legitimately
  # skip: `check_duplicate` sets `if: needs.check_duplicate.outputs.skip !=
  # 'true'` on all three when the pushed tree was already tested green on the
  # PR head (observed, not inferred: the attestation/merge-commit detector
  # verifies GitHub's own check-run record before recommending a skip). A
  # skip is treated as green ONLY alongside that; `check_duplicate` itself
  # must have succeeded, or the gate fails closed — a crashed duplicate
  # detector must never be silently read as "this run is a legitimate
  # dedup-hit". `check_duplicate` runs on every event, so requiring its
  # success does not change behaviour on `pull_request`/`workflow_dispatch`
  # runs, where its own `skip` output is always `false` (the merge-commit
  # detector only fires on `push`, and no attestation exists yet for a
  # not-yet-tested PR head).
  ci-required:
    name: CI Required
    needs: [check_duplicate, test, coverage, types, public-safe-lint, clean-venv]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI result
        env:
          DUP_RESULT: ${{ needs.check_duplicate.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          TYPES_RESULT: ${{ needs.types.result }}
          PUBLIC_SAFE_LINT_RESULT: ${{ needs.public-safe-lint.result }}
          CLEAN_VENV_RESULT: ${{ needs.clean-venv.result }}
        run: |
          echo "check_duplicate=$DUP_RESULT test=$TEST_RESULT coverage=$COVERAGE_RESULT types=$TYPES_RESULT public-safe-lint=$PUBLIC_SAFE_LINT_RESULT clean-venv=$CLEAN_VENV_RESULT"
          # The duplicate detector must itself have succeeded; otherwise we
          # cannot trust its skip decision and must fail closed.
          if [ "$DUP_RESULT" != "success" ]; then
            echo "::error::check_duplicate did not succeed (result='$DUP_RESULT') — failing the aggregate gate."
            exit 1
          fi
          # The shard-combining `coverage` job is where the 75% floor and the
          # every-test-ran-once check live. It may be skipped only when the
          # whole `test` matrix was skipped by the dedup above; once tests ran
          # (or failed, or were cancelled), anything but `success` fails.
          if [ "$TEST_RESULT" != "skipped" ] && [ "$COVERAGE_RESULT" != "success" ]; then
            echo "::error::coverage result '$COVERAGE_RESULT' with test result '$TEST_RESULT' — failing the aggregate gate."
            exit 1
          fi
          # `success`  → the job ran and passed.
          # `skipped`  → check_duplicate verified this push's tree was already
          #              tested green on the PR head; nothing new to prove.
          # anything else (failure/cancelled) → fail the gate.
          for pair in "test:$TEST_RESULT" "coverage:$COVERAGE_RESULT" "types:$TYPES_RESULT" "public-safe-lint:$PUBLIC_SAFE_LINT_RESULT" "clean-venv:$CLEAN_VENV_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success|skipped)
                echo "CI Required: $name green ($result)"
                ;;
              *)
                echo "::error::$name result '$result' is not green — failing the aggregate gate."
                exit 1
                ;;
            esac
          done
          echo "CI Required: green overall"
          exit 0
