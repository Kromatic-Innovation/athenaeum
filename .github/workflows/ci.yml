name: CI

# Third-party actions pinned to full commit SHAs for supply-chain hygiene.
# Semver-tag comment after each pin records the release the SHA maps to at
# pin time. Keep in sync with release.yml pins.
#
# CI runs on develop only (PR + push). `main` never runs its own CI: it is
# fast-forward-promoted from develop by promote-main.yml, which re-verifies
# the required check-runs on the promoted SHA before pushing the ref update.
# Since `main`'s tip is always the same commit SHA that develop already
# tested, an independent main-triggered run would be a pure duplicate of
# the develop run (CI-bill audit).

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel a superseded run when a newer commit lands on the same ref (M23,
# hestia#548). Keyed on workflow + ref so a PR's push run and the post-merge
# develop run stay independent, but stacked pushes to the same PR/branch
# cancel the in-flight run instead of queueing a duplicate 3-leg matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (Scorecard Token-Permissions, #405). CI only reads
# the repo and runs tests, so `contents: read` is sufficient; jobs that need
# more can widen this at the job level.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with vector extras)
        run: |
          python -m pip install --upgrade pip
          # Pin the transitive tree for reproducible CI (athenaeum#556). The lock
          # is applied as a CONSTRAINTS file: pyproject.toml still resolves the
          # graph per Python version, then each package is pinned to the locked
          # version. pyproject's published ranges are unchanged.
          pip install -e ".[dev,vector]" -c requirements-ci.lock

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=athenaeum --cov-report=term-missing --cov-fail-under=75

  # hestia#596 — BLOCKING type check. The package ships `py.typed` (a PEP 561
  # assertion of type correctness to downstream consumers); mypy now enforces
  # that assertion. The backlog that hestia#550 sized (and the two systemic
  # slices #594/#595 plus #596 cleared) is empty, so this job is wired into
  # `CI Required` (`needs: [test, types]` below) and the mypy step is no longer
  # `continue-on-error` — a type regression now gates merge and `main`
  # promotion. Runs on a single Python version — mypy is Python-version-agnostic
  # here (`python_version = "3.11"` is pinned in `[tool.mypy]`).
  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies (with type extras)
        run: |
          python -m pip install --upgrade pip
          # Same reproducible-CI lock (athenaeum#556); the `types`-only extras
          # (mypy + stubs) resolve unpinned since the lock tracks [dev,vector].
          pip install -e ".[dev,vector,types]" -c requirements-ci.lock

      - name: Type check with mypy
        run: mypy

  # hestia#557 — a single, always-present aggregate status that is intended to
  # be the ONE required check on develop/main. It runs on every event
  # (`if: always()`) so it reports a concrete conclusion instead of vanishing
  # when an upstream job is skipped/cancelled. Making the matrix `test` job
  # itself required would name per-leg checks (`test (3.11)` …) and would wedge
  # on any run where a leg is absent, since a missing required check never
  # resolves. This synthesized gate is the single required check instead.
  #
  # hestia#548 (M24): a *skipped* `test` is NO LONGER treated as green. The
  # `test` job carries no `if:` and no `paths:` filter, so it cannot be
  # legitimately skipped today — a skipped result therefore means zero tests
  # ran, and `promote-main.yml` accepts `CI Required == success` as the sole
  # promotion gate, so a skipped-is-green aggregate would promote `main` with
  # no tests the day a path filter is added. The gate is green ONLY when the
  # test matrix truly succeeded. If a future change adds a legitimate skip
  # condition to `test`, whoever adds it must whitelist that exact condition
  # here explicitly — not restore a blanket `skipped)` branch.
  ci-required:
    name: CI Required
    needs: [test, types]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI result
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TYPES_RESULT: ${{ needs.types.result }}
        run: |
          echo "test=$TEST_RESULT types=$TYPES_RESULT"
          # `success` → the job ran and passed. Anything else
          # (skipped/failure/cancelled) → fail the gate. Neither `test` nor
          # `types` may legitimately skip today (see the hestia#548 note above);
          # `types` (mypy) became blocking in hestia#596, so a type regression
          # now fails this aggregate exactly as a test failure does.
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::test job result '$TEST_RESULT' is not green — failing the aggregate gate."
            exit 1
          fi
          if [ "$TYPES_RESULT" != "success" ]; then
            echo "::error::types (mypy) job result '$TYPES_RESULT' is not green — failing the aggregate gate."
            exit 1
          fi
          echo "CI Required: green (test=$TEST_RESULT types=$TYPES_RESULT)"
          exit 0
