name: Release

# Actions pinned to full commit SHAs (not mutable tags). A compromised
# maintainer of any upstream action can retag `v4`/`release/v1`/etc. and
# push malicious code into our next release, which our trusted-publishing
# identity would then happily sign. SHA pins make action content
# immutable — upgrades are explicit PRs, not silent.
# Comment after each pin records the semver tag the SHA corresponded to
# at pin time, for human-readable version tracking.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write         # for PEP 740 build-provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify tag matches pyproject.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$proj" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($tag) does not match pyproject.toml version ($proj)"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

      # athenaeum#1442: this used to be an inline `awk` heredoc in the
      # `github-release` job below, which runs AFTER `publish` -- so an
      # oversized body (v0.20.0's CHANGELOG section: 183,969 characters as
      # measured by this script's own `len()` -- the same string's raw
      # UTF-8 byte count is slightly higher, ~184.7k, because the prose
      # has multi-byte characters like em dashes and curly quotes -- both
      # readings are well over GitHub's 125,000-character release-body cap)
      # surfaced as a `gh release create` HTTP 422 only after the PyPI
      # upload had already happened, irreversibly. Doing the extraction +
      # size guard here, in `build`, means the body is fully decided --
      # truncated-with-link if it's too big, verbatim otherwise -- before
      # `publish` ever runs.
      # Nothing downstream can hit an oversized body, because nothing
      # oversized is ever produced past this step: `publish` and
      # `github-release` just carry the already-safe result forward. The
      # 60,000-character threshold (well under GitHub's 125,000 hard cap)
      # is chosen and justified in scripts/extract_release_notes.py's
      # DEFAULT_MAX_CHARS comment; the degrade path (truncate on a line
      # boundary, append a notice + a link to the full section at this tag)
      # is exercised by tests/test_extract_release_notes.py, not assumed.
      - name: Extract + size-guard release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/extract_release_notes.py \
            --changelog CHANGELOG.md \
            --version "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --output release-notes.md \
            --max-chars 60000
          wc -c release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/athenaeum
    permissions:
      id-token: write          # OIDC exchange with PyPI + attestation signing
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish is a Docker container action. The
      # container image at `ghcr.io/pypa/gh-action-pypi-publish:<tag>` is
      # keyed by semver tag, not commit SHA — pinning the action at a SHA
      # (as we do for the JS-based actions above) causes the Docker pull
      # to 404 with "manifest unknown". We therefore pin by a specific
      # semver tag. That tag is still a mutable ref, but the tradeoff is
      # acceptable here: pypa is a first-party trusted publisher, and
      # the OIDC exchange with PyPI verifies both the repo and the
      # workflow ref at publish time. See v0.2.1 release attempt (run
      # 24582826878) for the failure mode this comment documents.
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # PEP 740 attestations — publisher mints a sigstore bundle,
          # PyPI stores it, downstream consumers can
          # `gh attestation verify` the wheel.
          attestations: true

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release for the pushed tag
    steps:
      # athenaeum#1442: release-notes.md is now produced (and size-guarded)
      # by the `build` job's "Extract + size-guard release notes" step,
      # before `publish` ran -- this job only downloads the already-safe
      # result. No checkout needed here: this job doesn't touch CHANGELOG.md
      # or any other repo file directly anymore.
      - name: Download release notes artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-notes

      # Idempotent: the next release may be cut manually with
      # `gh release create` before this job runs — if a release already
      # exists for the tag, skip cleanly instead of failing or duplicating.
      # The probe distinguishes a true 404 (no release yet -> create) from
      # transient API failures (auth/5xx -> fail loudly rather than risk
      # creating a duplicate on unknown state).
      - name: Create GitHub Release (skip if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          probe_err=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --silent 2>&1)
          probe_rc=$?
          set -e
          if [ "$probe_rc" -eq 0 ]; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
            exit 0
          fi
          if ! printf '%s\n' "$probe_err" | grep -q "HTTP 404"; then
            echo "::error::Release existence probe for $GITHUB_REF_NAME failed with a non-404 error; refusing to create a release on unknown state. Probe output: $probe_err"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
