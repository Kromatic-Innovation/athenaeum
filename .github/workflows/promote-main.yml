name: Promote Main

# ⚠️  CANONICAL CONSUMER STUB — DO NOT HAND-EDIT PER REPO.
#
# cwc#2756: this is no longer a copy of the full promotion workflow. The full
# implementation now lives ONCE, in code-workspace-config's own
# `.github/workflows/promote-main.yml`, as a `workflow_call` reusable
# workflow. This file is the SHORT stub every platform repo (registry
# `family: platform` + `promotionModel: develop-main`) commits as its own
# `.github/workflows/promote-main.yml` — it keeps the `workflow_dispatch`
# entry point `hestia promote`/`hestia ship` already speak, and forwards
# straight through to the canonical implementation.
#
# THIS COPY IS GENERATED. If you are reading this in a consumer repo, do not
# hand-edit it — the next sync overwrites any local change with canonical
# content again. Edit THIS template in code-workspace-config instead:
# `templates/promote-main.yml`, synced by `scripts/sync_promote_workflows.py`
# (same mechanism as before cwc#2756 — only the CONTENT being synced shrank).
#
# `@main` is a FLOATING pin, not a SHA or tag (operator decision, cwc#2756): a
# bad merge to cwc's `main` changes every consumer's promotion path at once,
# with no propagation step to catch it first. That risk was weighed and
# accepted deliberately — see the cwc#2756 decision comments — specifically
# to delete the propagation-lag failure mode this stub-and-sync arrangement
# used to have (a canonical edit not yet synced into a consumer's committed
# copy). Do not "fix" this to a SHA or `@v1` pin without raising that risk
# call again; it is not a local judgment call for a synced copy.
#
# `permissions:` below is intentionally non-empty even though this job does
# almost nothing itself: a called `workflow_call` job's permissions can only
# be NARROWED by the caller relative to what it declares, never widened, so
# the canonical implementation's actual needs (contents: write, actions:
# write, statuses/checks: read, pull-requests: read — see its own header for
# why) must be granted here too, or the call fails on a permissions error
# despite the canonical workflow asking correctly.
#
# `secrets: inherit` passes every secret this repo's Action run holds through
# to the canonical workflow (which loads `OP_SERVICE_ACCOUNT_TOKEN` from it).
# The canonical side deliberately declares no `secrets:` block of its own —
# see its header — so nothing here needs to be named explicitly either.
#
# Fleet-wide conformance of this file (every consumer's committed copy vs.
# THIS template) is enforced by cwc's `fleet-drift-guard.yml` /
# `scripts/check_fleet_drift.py` ("property 4", cwc#1889) — BLOCKING as of
# cwc#2015. During the cwc#2756→cwc#2760 cutover, a consumer that still
# carries the OLD pre-cutover full body (frozen at
# `templates/promote-main.pre-cutover.yml`) is ALSO accepted, report-only, so
# converting repos one at a time never reds cwc's own develop CI — see that
# guard's `check_template_conformance` for the exact acceptance logic and the
# report-only expiry.
#
# cwc#1468. End home: cron-fleet (rides cwc#1107).

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch for promotion (must be develop)
        required: true
        default: develop
      target_branch:
        description: Target branch for promotion (must be main)
        required: true
        default: main
      reason:
        description: Promotion reason for audit trail
        required: true
      sha:
        description: >-
          Optional exact commit SHA to promote. When set, this exact commit is
          promoted instead of re-resolving the source-branch tip (hestia#1021).
          Must be reachable from source_branch. When empty (the default),
          behavior is unchanged — the source-branch tip is promoted.
        required: false
        default: ''

permissions: {}

jobs:
  promote:
    name: Fast-forward Promote develop → main
    permissions:
      contents: write
      actions: write
      statuses: read
      checks: read
      pull-requests: read
    uses: Kromatic-Innovation/code-workspace-config/.github/workflows/promote-main.yml@main
    with:
      source_branch: ${{ inputs.source_branch }}
      target_branch: ${{ inputs.target_branch }}
      reason: ${{ inputs.reason }}
      sha: ${{ inputs.sha }}
    secrets: inherit
