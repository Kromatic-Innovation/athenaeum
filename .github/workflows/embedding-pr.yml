name: Embedding Regression Guard

# athenaeum#1609: `embedding`-marked tests assert on the REAL MiniLM model's
# cosine-similarity output (see tests/test_search.py's TestExactTitleRanking,
# the athenaeum#1603 guard). pyproject.toml:251's default addopts deselects
# `-m embedding` from the ordinary `pytest tests/` selection, so contributors
# never pay the ONNX download, but that also meant the marker previously ran
# ONLY on push to `main` (evals.yml's `embedding-suite` job, athenaeum#1091) —
# after code had already merged to `develop`. That let a real retrieval
# regression land on a PR unnoticed; see athenaeum#1609 for the incident.
# This workflow closes that gap by running the same `-m embedding` selection
# on the PRs that can plausibly break it, and again on push to `develop` so
# post-merge drift (e.g. a rebase that reintroduces a bad merge of the same
# files) is caught too.
#
# Path filter — one line per path, and every file that currently carries
# `@pytest.mark.embedding` is covered:
#   - src/athenaeum/search.py                     the athenaeum#1603 fix target: real-model retrieval ranking lives here
#   - src/athenaeum/delta.py                       feeds delta-compile-equivalence's real-model clustering assertions
#   - pyproject.toml                               pins the `[vector]` extra (chromadb/numpy) the real embedder depends on
#   - tests/test_search.py                         carries @pytest.mark.embedding (TestExactTitleRanking, the athenaeum#1603 guard)
#   - tests/test_delta_compile_equivalence.py      carries @pytest.mark.embedding
#   - tests/test_eval_corpus_consolidation.py      carries @pytest.mark.embedding
#   - tests/test_eval_recall_floor.py              parametrizes a `vector` case marked embedding
#   - tests/evals/test_recall_eval.py              parametrizes a `vector` case marked embedding
#
# Deliberately NOT self-referential (no entry for this workflow file's own
# path): while an edit to this guard genuinely deserves a self-test, path
# filters are evaluated over the WHOLE PR diff against the base branch, not
# the top commit alone — a self-entry would mean any PR built on a branch
# that had not yet merged this file (i.e. every PR during this file's own
# introduction, including a docs-only one stacked on the same branch) would
# spuriously trigger the job just because the file itself was "new" in the
# diff. Once merged to develop, an intentional edit to this file can still be
# smoke-tested with `workflow_dispatch` or by touching one of the paths above
# in the same PR.
#
# Status: ADVISORY, not a required status context (out of scope per
# athenaeum#1609) — it is not named in any branch-protection required-checks
# list, and is deliberately kept in its own workflow file rather than folded
# into ci.yml's `ci-required` aggregate. Reader: hestia's PR observer and the
# promotion-runner gate read this check's conclusion on retrieval-path PRs
# (athenaeum#1609 plan step 4) and flag a red run for human attention; they do
# not block merge or promotion on it.
#
# evals.yml's push-to-main `embedding-suite` job is UNCHANGED and stays in
# place: it is the release-path net (catches drift between the last
# develop-CI run and what actually reaches `main`), while this workflow is
# the pre-merge net. The two are complementary, not redundant.
#
# Third-party actions pinned to full commit SHAs for supply-chain hygiene,
# matching ci.yml's convention.

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/athenaeum/search.py'
      - 'src/athenaeum/delta.py'
      - 'pyproject.toml'
      - 'tests/test_search.py'
      - 'tests/test_delta_compile_equivalence.py'
      - 'tests/test_eval_corpus_consolidation.py'
      - 'tests/test_eval_recall_floor.py'
      - 'tests/evals/test_recall_eval.py'
  push:
    branches: [develop]
    paths:
      - 'src/athenaeum/search.py'
      - 'src/athenaeum/delta.py'
      - 'pyproject.toml'
      - 'tests/test_search.py'
      - 'tests/test_delta_compile_equivalence.py'
      - 'tests/test_eval_corpus_consolidation.py'
      - 'tests/test_eval_recall_floor.py'
      - 'tests/evals/test_recall_eval.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (Scorecard Token-Permissions, athenaeum#405); this
# workflow only checks out and runs tests.
permissions:
  contents: read

jobs:
  embedding-guard:
    name: MiniLM-dependent suite (PR/push guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Keyed on the chromadb version actually resolved via
      # requirements-ci.lock (not hardcoded), so a chromadb bump that ships a
      # new ONNX artifact invalidates the cache automatically.
      - name: Resolve chromadb version for cache key
        id: chromadb-version
        run: |
          version="$(grep -m1 '^chromadb==' requirements-ci.lock | cut -d= -f3)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve a pinned chromadb version from requirements-ci.lock"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache chromadb ONNX embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/chroma/onnx_models
          key: embedding-onnx-${{ runner.os }}-chromadb-${{ steps.chromadb-version.outputs.version }}

      - name: Install dependencies (with vector extras)
        run: |
          python -m pip install --upgrade pip
          # Same reproducible-CI lock ci.yml's `test` job uses (athenaeum#556).
          pip install -e ".[dev,vector]" -c requirements-ci.lock

      - name: Run MiniLM-dependent suite
        run: pytest tests/ -m embedding -v --tb=short --no-cov
