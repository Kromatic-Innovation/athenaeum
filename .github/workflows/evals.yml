name: Evals

# Live-API eval suite (issue athenaeum#331). Triggers:
#   * workflow_dispatch — on-demand, optionally with `record=true` to
#     persist raw response bodies to tests/fixtures/recorded/, uploaded as
#     a `recorded-fixtures` artifact (someone must download it and commit
#     the drift themselves). **This is the ONLY trigger for the `eval`
#     job.** Operator decision 2026-09-16: token-spending evals run
#     manually, when a change to a prompt, a model tier, the compile
#     pipeline, the recall path, or the sidecar could move a result — not
#     on every release. See docs/design/native-memory-baseline.md §9.
#   * push to `main` — runs ONLY the token-free `embedding-suite` job
#     (real MiniLM cosines, no Anthropic key, athenaeum#1091). The `eval`
#     job is gated off this trigger by its `if:` below.
#   * workflow_dispatch with `north_star=true` — issue athenaeum#1733: runs
#     the north-star grid (`tests/evals/north_star_cli.py`) in API
#     mode (no logged-in `claude` CLI needed, just the same key `eval`
#     already loads) and uploads the rendered markdown report as an
#     artifact. **Also gated to workflow_dispatch only, same as `eval` —
#     NEVER on push.** See docs/design/native-memory-baseline.md §4/§9.
#
# Regular CI (ci.yml) is on `develop` only, so this workflow does NOT
# collide with it: they trigger on distinct refs.
#
# Credential: the Anthropic API key is pulled from 1Password at run time
# via `1password/load-secrets-action` (mirroring promote-main.yml), so no
# raw Anthropic key is stored as a GitHub secret. The key lives at
# `op://Infrastructure/anthropic-api-key/credential`; the existing org
# secret `OP_SERVICE_ACCOUNT_TOKEN` (already used by promote-main.yml)
# reads the Infrastructure vault.
#
# Until that op item exists the load step is a no-op (continue-on-error)
# and the harness cleanly skips every eval case (no ANTHROPIC_API_KEY →
# build_live_client returns None → pytest.skip). The recorded-fixture
# replay tests under tests/test_recorded_fixtures.py still run in the
# regular develop-CI suite with zero network. Regular CI is unaffected.
#
# GitHub-published actions are SHA-pinned (mirroring ci.yml); the
# load-secrets action is tag-pinned to match promote-main.yml's
# established op convention.

on:
  workflow_dispatch:
    inputs:
      record:
        description: "Persist responses to tests/fixtures/recorded/ (uploads a recorded-fixtures artifact to download and commit)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      north_star:
        description: "Also run the north-star grid (tests/evals/north_star_cli.py) in API mode and upload the report"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      north_star_scale:
        description: "north_star_cli.py --scale (run-level budget tier)"
        required: false
        default: "smoke"
        type: choice
        options:
          - "smoke"
          - "small"
          - "full"
      north_star_corpus_scales:
        description: "north_star_cli.py --corpus-scales (comma-separated; blank = the default scales; xlarge is opt-in)"
        required: false
        default: ""
      north_star_max_spend:
        description: "north_star_cli.py --max-spend (refusal ceiling, USD)"
        required: false
        default: "1.0"
      north_star_max_tokens:
        description: "north_star_cli.py --max-tokens (per-run token ceiling; blank = derived from --max-spend)"
        required: false
        default: ""
      north_star_workers:
        description: "north_star_cli.py --workers (cells run concurrently; 1 = serial)"
        required: false
        default: "4"
      north_star_relevance_floor_vector:
        description: "north_star_cli.py --relevance-floor-vector (issue athenaeum#1761; blank = off, the default)"
        required: false
        default: ""
      north_star_relevance_floor_fts5:
        description: "north_star_cli.py --relevance-floor-fts5 (issue athenaeum#1761; blank = off, the default)"
        required: false
        default: ""
      north_star_phase2:
        description: "Also run the Phase 2 write path (north_star_cli.py --phase2, issue athenaeum#1785) before the read grid -- spends on BOTH systems"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      north_star_phase2_scales:
        description: "north_star_cli.py --phase2-scales (comma-separated; blank = the CLI's own default, medium)"
        required: false
        default: ""
      north_star_phase2_systems:
        description: "north_star_cli.py --phase2-systems (comma-separated; blank = the CLI's own default, athenaeum,native)"
        required: false
        default: "athenaeum,native"
  push:
    branches: [main]

# Stacked main-pushes must not accumulate spend — cancel any in-flight
# run when a newer commit lands. Dispatch runs share the group so an
# accidental double-dispatch also collapses to one run.
concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  embedding-suite:
    # Issue athenaeum#1091: tests marked `embedding` assert on real MiniLM
    # cosine-similarity values (e.g. tests/test_delta_compile_equivalence.py's
    # `test_chain_transitive_repartition`, which pins a specific
    # complete-linkage clique shape that only holds for the real model's
    # cosines — see that test file's module docstring). They are deselected
    # from the default `pytest tests/` selection (`-m 'not eval and not
    # embedding'`) so the regular contributor/CI suite never downloads the
    # ONNX model, but still need to run SOMEWHERE so the coverage isn't
    # silently dropped. This job is that "somewhere": no Anthropic API key
    # needed (unlike the `eval` job below), just the `[vector]` extra and
    # real network egress for chromadb's one-time ONNX model fetch.
    name: MiniLM-dependent suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vector]"

      - name: Run MiniLM-dependent suite
        run: pytest tests/ -m embedding -v --tb=short --no-cov

  eval:
    name: Live-API eval suite
    # Manual dispatch only — a push to `main` runs `embedding-suite` above
    # and nothing that spends tokens (operator decision 2026-09-16).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vector]"
          pip install pyyaml

      - name: Load Anthropic API key from 1Password
        # No-op until the op item exists / OP_SERVICE_ACCOUNT_TOKEN is set —
        # continue-on-error keeps the workflow green-skips rather than
        # crashing, preserving the "mergeable before provisioning" property.
        id: op-key
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_API_KEY: op://Infrastructure/anthropic-api-key/credential

      - name: Run eval suite
        env:
          # ``ATHENAEUM_EVAL_RECORD`` toggles the `--record` mode inside the
          # harness so a workflow_dispatch with record=true seeds fixtures
          # for the follow-up commit. The default dispatch does NOT record.
          ATHENAEUM_EVAL_RECORD: ${{ github.event.inputs.record == 'true' && '1' || '0' }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set (op item not provisioned) — eval suite will skip"
          fi
          pytest tests/evals/ -m eval -v --tb=short \
            --eval-summary=eval-summary.json

      - name: Upload eval summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eval-summary
          path: eval-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload recorded fixtures (record mode only)
        if: ${{ always() && github.event.inputs.record == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: recorded-fixtures
          path: tests/fixtures/recorded/
          if-no-files-found: warn
          retention-days: 30

  north-star:
    name: North-star grid (API mode)
    # Manual dispatch only, and only when explicitly requested via the
    # north_star input -- issue athenaeum#1733. Never on push (there is no
    # `push` branch on this job's `if:` at all, matching `eval`'s own gate).
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.north_star == 'true'
    runs-on: ubuntu-latest
    # Issue athenaeum#1751: 60 minutes could not hold the full grid even
    # concurrently -- `--scale full --dry-run` projects 1392 cells, and at
    # the default 4 workers that is hours, not one. 300 minutes is under
    # GitHub's 360-minute job cap with headroom, and the job is dispatch-only
    # so a long window costs nothing until someone asks for it. Run
    # `--dry-run` first: it prints the projected wall clock at the worker
    # count you are about to choose, which is the number to compare against
    # this one.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vector]"
          pip install pyyaml

      - name: Load Anthropic API key from 1Password
        # Same no-op-until-provisioned discipline as the `eval` job above --
        # the grid's own single-shot arms and API-mode tool loops both go
        # through this key; a missing key surfaces as build_live_client()
        # raising inside north_star_cli.py, which the run step below reports
        # as an aborted/PARTIAL report rather than a bare crash.
        id: op-key
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2  # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_API_KEY: op://Infrastructure/anthropic-api-key/credential

      - name: Run north-star grid
        env:
          # Routed through env:, never interpolated into run: (Quine review,
          # issue athenaeum#1733, SHOULD item 6) -- an untrusted/unexpected
          # dispatch input value lands in a shell variable, not spliced
          # directly into the script text, so it cannot break out of its
          # argument position.
          ATHENAEUM_EVAL_MODE: api
          NORTH_STAR_SCALE: ${{ github.event.inputs.north_star_scale }}
          NORTH_STAR_CORPUS_SCALES: ${{ github.event.inputs.north_star_corpus_scales }}
          NORTH_STAR_MAX_SPEND: ${{ github.event.inputs.north_star_max_spend }}
          NORTH_STAR_MAX_TOKENS: ${{ github.event.inputs.north_star_max_tokens }}
          NORTH_STAR_WORKERS: ${{ github.event.inputs.north_star_workers }}
          NORTH_STAR_RELEVANCE_FLOOR_VECTOR: ${{ github.event.inputs.north_star_relevance_floor_vector }}
          NORTH_STAR_RELEVANCE_FLOOR_FTS5: ${{ github.event.inputs.north_star_relevance_floor_fts5 }}
          NORTH_STAR_PHASE2: ${{ github.event.inputs.north_star_phase2 }}
          NORTH_STAR_PHASE2_SCALES: ${{ github.event.inputs.north_star_phase2_scales }}
          NORTH_STAR_PHASE2_SYSTEMS: ${{ github.event.inputs.north_star_phase2_systems }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set (op item not provisioned) — north-star run will fail to construct a client"
          fi
          CORPUS_SCALES_FLAG=()
          if [ -n "${NORTH_STAR_CORPUS_SCALES:-}" ]; then
            CORPUS_SCALES_FLAG=(--corpus-scales "$NORTH_STAR_CORPUS_SCALES")
          fi
          # Left off entirely when blank, so the CLI derives the token
          # ceiling from --max-spend (issue athenaeum#1754) instead of this
          # workflow hardcoding a second ceiling that could disagree with
          # the dollar one.
          MAX_TOKENS_FLAG=()
          if [ -n "${NORTH_STAR_MAX_TOKENS:-}" ]; then
            MAX_TOKENS_FLAG=(--max-tokens "$NORTH_STAR_MAX_TOKENS")
          fi
          # Issue athenaeum#1761: left off entirely when blank, same as
          # every other optional flag above -- the CLI's own default (no
          # floor) applies, byte-identical to a dispatch that predates
          # this input.
          RELEVANCE_FLOOR_VECTOR_FLAG=()
          if [ -n "${NORTH_STAR_RELEVANCE_FLOOR_VECTOR:-}" ]; then
            RELEVANCE_FLOOR_VECTOR_FLAG=(--relevance-floor-vector "$NORTH_STAR_RELEVANCE_FLOOR_VECTOR")
          fi
          RELEVANCE_FLOOR_FTS5_FLAG=()
          if [ -n "${NORTH_STAR_RELEVANCE_FLOOR_FTS5:-}" ]; then
            RELEVANCE_FLOOR_FTS5_FLAG=(--relevance-floor-fts5 "$NORTH_STAR_RELEVANCE_FLOOR_FTS5")
          fi
          # Issue athenaeum#1786: --phase2 itself is a bare flag (no value),
          # so it is added to the argv only when the input is exactly
          # "true" -- the choice input's own default ("false") therefore
          # leaves Phase 2 off, byte-identical to a dispatch that predates
          # this input. --phase2-scales/--phase2-systems are left off
          # entirely when blank, same as every other optional flag above,
          # so the CLI's own defaults (medium / athenaeum,native) apply.
          PHASE2_FLAG=()
          if [ "${NORTH_STAR_PHASE2:-false}" = "true" ]; then
            PHASE2_FLAG=(--phase2)
          fi
          PHASE2_SCALES_FLAG=()
          if [ -n "${NORTH_STAR_PHASE2_SCALES:-}" ]; then
            PHASE2_SCALES_FLAG=(--phase2-scales "$NORTH_STAR_PHASE2_SCALES")
          fi
          PHASE2_SYSTEMS_FLAG=()
          if [ -n "${NORTH_STAR_PHASE2_SYSTEMS:-}" ]; then
            PHASE2_SYSTEMS_FLAG=(--phase2-systems "$NORTH_STAR_PHASE2_SYSTEMS")
          fi
          # --store lands under measurements/ (not the system temp dir the
          # CLI defaults to) so a run killed at timeout-minutes still leaves
          # its completed cells somewhere the upload step below can reach --
          # issue athenaeum#1751. On that kill path no markdown report is ever
          # written, so the JSONL and its planned-count sidecar are the ONLY
          # artifact, and re-running with the same --store resumes from them.
          mkdir -p measurements
          python -m tests.evals.north_star_cli \
            --mode api \
            --scale "$NORTH_STAR_SCALE" \
            --max-spend "$NORTH_STAR_MAX_SPEND" \
            --workers "$NORTH_STAR_WORKERS" \
            --store measurements/north-star-store.jsonl \
            --out-dir measurements \
            "${CORPUS_SCALES_FLAG[@]}" \
            "${MAX_TOKENS_FLAG[@]}" \
            "${RELEVANCE_FLOOR_VECTOR_FLAG[@]}" \
            "${RELEVANCE_FLOOR_FTS5_FLAG[@]}" \
            "${PHASE2_FLAG[@]}" \
            "${PHASE2_SCALES_FLAG[@]}" \
            "${PHASE2_SYSTEMS_FLAG[@]}"

      - name: Upload north-star report
        # `always()` so a failed, refused or TIMED-OUT run still ships what
        # it has. The store and its sidecar are listed alongside the report
        # because a timeout kill produces the former and never the latter.
        # The Phase 2 sibling JSONL (issue athenaeum#1786) is listed the
        # same way -- a run killed mid-Phase-2 still leaves it, and it is
        # never empty-but-missing since it is only ever referenced when
        # `--phase2` actually ran.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: north-star-report
          path: |
            measurements/north-star-*.md
            measurements/north-star-store.jsonl
            measurements/north-star-store.jsonl.planned.json
            measurements/north-star-store.jsonl.phase2.jsonl
          if-no-files-found: warn
          retention-days: 30
