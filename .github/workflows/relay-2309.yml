name: Relay 2309 measurements

# TEMPORARY, BRANCH-ONLY relay -- issue athenaeum#2309, and removed from this
# branch before its PR merges (precedent: the "Relay 1854" / "Relay 1870" /
# "Relay 1871" workflows, each added for one measurement and deleted again).
#
# Why it exists: a north-star dispatch's report and result store leave the
# runner as an Actions ARTIFACT, and an artifact download goes to a blob host
# a build lane cannot reach. The lane therefore cannot read its own paid run's
# output. This workflow runs INSIDE Actions, where the artifact IS reachable,
# renders the small derived summaries, and pushes them onto the measurement
# branch where the lane can read them with the contents API.
#
# Triggered by a push to `relay/**` (never workflow_dispatch: a dispatch-only
# workflow has to be on the default branch to be dispatchable, and this one
# must never reach the default branch). The request is the committed
# `.relay/request.json`. Results are pushed to `target_branch`, which is NEVER
# a `relay/**` ref, so this workflow cannot re-trigger itself.

on:
  push:
    branches:
      - "relay/**"

permissions:
  contents: write

jobs:
  relay:
    name: Relay north-star artifact to the measurement branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the relay request
        id: req
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          req = json.loads(pathlib.Path(".relay/request.json").read_text())
          for key in ("run_id", "artifact", "target_branch", "label"):
              value = str(req[key])
              assert value and "\n" not in value, (key, value)
              print(f"{key}={value}")
          # Optional: which model to PRICE an unstamped store against.
          label = str(req.get("model_label", ""))
          assert "\n" not in label, label
          print(f"model_label={label}")
          PY

      - name: Download the north-star artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ steps.req.outputs.artifact }}
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: relayed

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vector]"

      - name: Inventory and digest what arrived
        run: |
          set -euo pipefail
          mkdir -p relay-out
          {
            echo "# Relay manifest -- run ${{ steps.req.outputs.run_id }} (${{ steps.req.outputs.label }})"
            echo
            echo "| file | bytes | sha256 |"
            echo "| --- | --- | --- |"
            find relayed -type f | sort | while read -r f; do
              printf '| `%s` | %s | `%s` |\n' \
                "${f#relayed/}" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > "relay-out/manifest.md"
          cat relay-out/manifest.md

      - name: Render the noise-floor summary from the result store
        env:
          MODEL_LABEL: ${{ steps.req.outputs.model_label }}
        # The analyser is committed on the measurement branch (issue
        # athenaeum#2309). Guarded so an early relay -- dispatched before the
        # analyser lands -- still ships the manifest and the rendered report.
        run: |
          set -euo pipefail
          if [ ! -f tests/evals/noise_floor.py ]; then
            echo "::notice::tests/evals/noise_floor.py not present on this ref -- skipping the derived summary"
            exit 0
          fi
          # Named EXACTLY, not globbed: the artifact also carries
          # `north-star-store-vector.jsonl.preflight.jsonl` (the pre-flight
          # probe's own 8 rows), which a `north-star-store*.jsonl` glob
          # matches and `head -1` can pick ahead of the real store -- the
          # first relay of run 42169666857 measured those 8 rows and
          # reported them as the whole grid.
          STORE=""
          for candidate in \
            relayed/north-star-store-vector.jsonl \
            relayed/north-star-store.jsonl; do
            if [ -f "$candidate" ]; then STORE="$candidate"; break; fi
          done
          if [ -z "$STORE" ]; then
            echo "::warning::no result store in the artifact -- skipping the derived summary"
            exit 0
          fi
          # --model-label prices a store written before athenaeum#2309's
          # RolloutRecord.model stamp; it is IGNORED when the rows carry
          # their own model, which is authoritative.
          MODEL_LABEL_FLAG=()
          if [ -n "${MODEL_LABEL:-}" ]; then
            MODEL_LABEL_FLAG=(--model-label "$MODEL_LABEL")
          fi
          python -m tests.evals.noise_floor \
            --store "$STORE" \
            --run-id "${{ steps.req.outputs.run_id }}" \
            "${MODEL_LABEL_FLAG[@]}" \
            --out "relay-out/noise-floor-${{ steps.req.outputs.label }}.md" \
            --json-out "relay-out/noise-floor-${{ steps.req.outputs.label }}.json"

      - name: Push the relayed outputs to the measurement branch
        env:
          TARGET: ${{ steps.req.outputs.target_branch }}
          LABEL: ${{ steps.req.outputs.label }}
          RUN_ID: ${{ steps.req.outputs.run_id }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET"
          git checkout -B relay-work "origin/$TARGET"
          DEST="docs/measurements/relayed/$LABEL"
          mkdir -p "$DEST"
          cp -v relay-out/* "$DEST"/
          # Carry every SMALL artifact file through in full -- the rendered
          # grid report (the Actions artifact expires after 30 days, the same
          # reason athenaeum#1854 committed its render in-tree) and the eval
          # summary whose token_usage is this dispatch's own spend receipt.
          # The result store itself (*.jsonl, tens of MB of transcripts) is
          # deliberately NOT carried: the derived summaries above are what a
          # reader needs, and a store that size does not belong in git. The 2M
          # bound is sized for the rendered report: the 768-row 2026-09-19
          # render is 221 KB, so a 1824-row render lands around 500 KB.
          find relayed -type f ! -name '*.jsonl' -size -2M -exec cp -v {} "$DEST"/ \;
          # -f: eval-summary.json is gitignored at the repo root (it is a
          # generated artifact), and it is this dispatch's own spend receipt.
          git add -f "$DEST"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "relay: north-star run $RUN_ID outputs ($LABEL) [skip ci]"
          git push origin "HEAD:$TARGET"
