# SPDX-License-Identifier: Apache-2.0
#
# Example shape rule (issue athenaeum#901) -- NOT loaded automatically. Copy
# this file (or a variant) into <knowledge-root>/rules/ to activate it;
# `athenaeum init --with-rules` does that copy for you.
#
# A `fallthrough` example: recognises a shape (by filename glob + a
# list-membership field predicate) worth NAMING and counting in the ledger,
# but deliberately routes it to the reasoning tiers rather than
# auto-compiling it -- e.g. because the operator wants a human/LLM judgement
# call on every record of this shape, at least for now. Nothing is written
# by this rule; the record is left exactly as ordinary intake found it. See
# docs/design/shape-rules.md for the full rule-schema reference.

version: 1
name: example-unrecognized-export-fallthrough
mode: observe

match:
  filename_glob: "*-export.csv.md"
  fields:
    category:
      in: ["cold", "warm", "unknown"]

disposition: fallthrough
