# Shipped calibration record for contact-value attribution (athenaeum#2211).
#
# Design docs/design/attribution-verification.md §12.4. This record was
# generated with the harness's offline dataset/metrics wiring but WITHOUT
# any live model call -- a build lane has no authority to dispatch
# evals.yml or spend tokens (see this issue's own "Out of scope" / Blocks
# on section). Every entry below therefore ships `passes: false`, with
# `signal: class-level` and zero-valued measured fields as an explicit
# "not yet measured" marker, not a real result. `model`,
# `n_fit`/`n_holdout`, `dataset_sha256` and `prompt_sha256` ARE real: they
# describe this record's fallback model, the actual fit/held-out split
# sizes in the committed corpus, and the actual sha256 of that corpus and
# of the shipped judge prompt, respectively.
#
# In `auto` mode (design §9), every class with `passes: false` stays
# `observe` -- no class here is recommended for any tier until a live run
# (`pytest tests/evals/test_attribution_eval.py -m eval`, dispatched by an
# operator or CI's evals.yml workflow_dispatch) records real numbers and
# this file is regenerated.
