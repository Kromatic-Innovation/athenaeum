[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athenaeum"
version = "0.19.17"
description = "Open source knowledge management pipeline — append-only intake, tiered compilation, configurable schemas"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "Kromatic Innovation", email = "open-source@kromatic.com" },
]
keywords = ["knowledge-management", "ai", "llm", "memory", "compilation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0,<7",
    # anthropic is pre-1.0 and ships breaking changes freely; fastmcp is
    # post-1.0 (3.x as of 2026-05) but still iterating on its MCP protocol
    # surface; chromadb has shipped sqlite schema migrations in minor bumps.
    # We cap each at an explicit upper bound (next-major boundary or wider)
    # so a surprise release can't silently break a released athenaeum
    # wheel — bumps are explicit PRs.
    # Floor 0.39.0: first stable release shipping client.messages.batches
    # (the Batch API surface batch-mode depends on, athenaeum#236).
    # Last tested against anthropic 0.109.2 (2026-06-18). The range stays
    # open to <1.0; record the tested minor here so a CI run that resolves a
    # newer-than-tested 0.x is visible at a glance against this baseline.
    "anthropic>=0.39.0,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.0.0,<4.0",
]
vector = [
    "chromadb>=0.5.0,<2.0",
    # Issue athenaeum#542: declared explicitly — recurring_claims.py's numpy fast-path
    # (`import numpy as np  # noqa: PLC0415`) was previously an undeclared
    # dependency, riding in only transitively via chromadb.
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.0",
    "fastmcp>=2.0.0,<4.0",
    # athenaeum#1066: emits `::error file=...,line=...::` workflow commands for
    # each failing test under `GITHUB_ACTIONS=true`, which GitHub turns into
    # check-run annotations — readable via `gh api
    # repos/{owner}/{repo}/check-runs/{id}/annotations` even from a lane that
    # cannot reach Actions job logs. Purely additive: a no-op outside GitHub
    # Actions (auto-detects the env var), so it changes no local test output.
    "pytest-github-actions-annotate-failures>=0.2.0",
    # `build` + `hatchling` let tests/test_skill_packaging.py build the wheel
    # via `python -m build --no-isolation` and assert the bundled skills/
    # directory is present in the BUILT artifact (issue athenaeum#419) — the acceptance
    # bar is "verify presence in the built artifact, not just in git".
    # hatchling is the build backend (see [build-system]); pinning it here too
    # makes the no-isolation build deterministic and offline in CI.
    "build>=1.0",
    "hatchling",
]
types = [
    # Type-check tooling (hestia#550, made blocking in hestia#596). Exact-
    # pinned like ruff so results are deterministic run-to-run. mypy IS now a
    # required check — see the ci.yml `types` job (wired into `CI Required`)
    # and [tool.mypy]. The backlog athenaeum#550 sized has been cleared.
    "mypy==2.3.0",
]
bench = [
    # Optional: pytest-benchmark is only needed to run tests/benchmarks/
    # (p95 search-latency harness, issue athenaeum#69). The main `dev` extra does
    # NOT include it so CI's default `pytest` invocation doesn't slow
    # down — the benchmark module is ignored by default via
    # `[tool.pytest.ini_options].addopts` below.
    "pytest>=8.0",
    "pytest-benchmark>=4.0,<6.0",
]

[project.scripts]
athenaeum = "athenaeum.cli:main"

[project.urls]
Homepage = "https://github.com/Kromatic-Innovation/athenaeum"
Repository = "https://github.com/Kromatic-Innovation/athenaeum"
Issues = "https://github.com/Kromatic-Innovation/athenaeum/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/athenaeum"]
# Non-Python artefacts we ship in the wheel. Current hatchling defaults
# already pick these up, but declaring them explicitly protects against
# future default-include shifts that would silently break `athenaeum init`
# (schema templates) or type-checker discovery (PEP 561 marker).
include = [
    "src/athenaeum/py.typed",
    "src/athenaeum/schema/**/*.md",
    "src/athenaeum/templates/**/*.md",
    # Packaged shape-rule examples (issue athenaeum#901) -- copied into
    # <knowledge-root>/rules/ by `athenaeum init --with-rules`, never
    # hardcoded engine defaults. Same force-inclusion rationale as the two
    # entries above: a bundled resource an operator opts into at runtime
    # must actually ship in the wheel, not just in git.
    "src/athenaeum/rule_examples/**/*.yaml",
]

# Ship the bundled skills/ directory (adapter-authoring, issue athenaeum#419) INSIDE the
# installed package so it is present in the built WHEEL — not just in git. A
# top-level skills/ lives outside `packages = ["src/athenaeum"]`, so without an
# explicit force-include hatchling would silently drop it from the wheel — the
# same files-allowlist trap that excluded a committed persona file from an npm
# package (panelist precedent). force-include maps skills/ to athenaeum/skills/,
# discoverable at runtime via importlib.resources.files("athenaeum") / "skills".
# The sdist keeps skills/ automatically via hatchling's VCS default (every
# git-tracked file), so no separate sdist config is needed.
#
# examples/ hits the identical trap (issue athenaeum#793) and is force-included
# for the same reason, deliberately decided rather than defaulted: the issue
# offered a tiebreaker — skills was force-included on the argument that a
# bundled resource users need at runtime belongs in the wheel; examples/ is
# arguably documentation instead, which would argue for leaving the wheel
# alone and just improving discoverability (Option B in the issue). We chose
# to force-include anyway (Option A) because examples/claude-code/ is not
# just reference material — it is the only way to install the passive-recall
# hook kit (settings-snippet.json, four hook scripts, the env-var reference),
# so "documentation" undersells it. Concretely, a correctness fix to
# user-prompt-recall.sh landed in athenaeum#792 immediately before this
# decision; a fix a `pip install`-only user cannot receive is not much of a
# fix. That tips the same "runtime resource" argument that justified `skills`
# in favor of `examples` too, so the two force-includes match rather than
# differ. Costs a modest wheel-size increase; the sdist already carried
# examples/ via hatchling's VCS default, unaffected by this change.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "athenaeum/skills"
"examples" = "athenaeum/examples"

# sdist: keep AGENTS.md OUT of the published source distribution (issue athenaeum#612).
# By hatchling's VCS default every git-tracked file — including AGENTS.md —
# ships in the sdist, so a machine-local leak into this contributor-facing file
# would be published to PyPI, not merely to GitHub. AGENTS.md is agent/contributor
# guidance for working IN the repo; a PyPI source consumer does not need it.
# Excluding it is defense-in-depth: even if local-workspace content is ever
# re-injected here (the athenaeum#612 / cwc#1841 failure mode), it cannot reach PyPI.
# This is the sdist-inclusion decision AC #3 asks to record; reverse it by
# deleting this exclude if AGENTS.md is later wanted in the sdist.
[tool.hatch.build.targets.sdist]
exclude = ["AGENTS.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# RUF100 flags `# noqa` directives that suppress a rule which is not enabled
# (or which no longer fires), so a dead suppression can't silently accumulate
# and read as an audited-and-accepted site (hestia#549). Widening `select`
# here changes *what* is linted, not *whether* lint gates: `ruff check`
# remains a required check exact-pinned to ruff==0.16.0.
#
# BLE001 (hestia#592): flags `except Exception`/bare-except. Every `src/`
# site was given an honest per-site judgement — narrowed to a specific
# exception type where a failure mode is expected, or kept broad with a
# live, rationale-bearing `# noqa: BLE001` at a deliberate last-resort
# boundary (best-effort cleanup, ledger/advisor writes that must never
# break a run, an offline-fallback construction, a chromadb boundary whose
# exception types move across releases). RUF100 (above) now keeps every
# one of those suppressions honest.
select = ["E", "F", "I", "W", "RUF100", "BLE001"]

[tool.mypy]
# BLOCKING type check (hestia#550 sized the backlog; hestia#596 cleared it and
# made mypy required). The package ships `py.typed` (a PEP 561 assertion of type
# correctness to downstream consumers), and mypy now enforces that assertion:
# the CI `types` job is wired into the `CI Required` aggregate and is no longer
# `continue-on-error`, so a type regression gates merge and `main` promotion.
# `warn_unused_ignores` keeps dead `# type: ignore` markers from accumulating.
# Strictness is intentionally still incremental here — tighten `[tool.mypy]`
# (e.g. `disallow_untyped_defs`) in a follow-up, keeping the check green.
python_version = "3.13"
files = ["src/athenaeum"]
warn_unused_ignores = true
# Third-party deps ship without stubs (anthropic, chromadb, fastmcp, …);
# silence import-not-found so the sizing measures athenaeum's own
# annotations, not missing upstream stubs.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/benchmarks/ is excluded from the default collection so CI's
# vanilla `pytest` invocation doesn't pull in pytest-benchmark. Run them
# explicitly with `pytest tests/benchmarks/ --benchmark-only` (cli paths
# override `--ignore`). See tests/benchmarks/test_search_bench.py.
#
# `eval` tests (tests/evals/) are DESELECTED by default via `-m "not eval"`
# so the regular contributor / CI suite never hits the network — the eval
# suite runs ONLY via evals.yml (workflow_dispatch or push:main) which
# invokes `pytest -m eval tests/evals/`. See tests/evals/README.md.
addopts = "--ignore=tests/benchmarks -m 'not eval'"
markers = [
    "regression: contract regression tests pinning resolver outputs against canonical fixtures",
    "live: opt-in live-LLM tests; require ATHENAEUM_LIVE_TESTS=1 and ANTHROPIC_API_KEY",
    "eval: live-API eval suite under tests/evals/; deselected by default (see evals.yml)",
]
