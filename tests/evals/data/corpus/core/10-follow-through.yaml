- uid: policy-subsidiary-billing-split
  type: policy
  name: Billing split policy
  tags: [policy, finance]
  source_ref: "session-2026-05-12"
  created: 2026-05-12
  body: |
    # Billing split policy

    Invoices are split by cost center only when the split has been confirmed
    in writing by the finance contact; an unconfirmed split defaults to a
    single combined invoice.

    Internal reference code: Copperfen.
