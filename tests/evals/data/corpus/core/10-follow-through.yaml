# follow_through probe pairs (issue athenaeum#1737). Invented; see
# ../README.md for the content policy.
#
# Each pair below is a (surfaced page, second-hop page) linked by a BODY
# `[[wikilink]]` (not just the `links:`/`related:` frontmatter shorthand,
# which is also authored on every first-hop page below so the relatedness
# ground truth still sees the edge, but is NOT what `validate_core`'s
# `follow_through` check accepts as the qualifying edge -- see that check's
# docstring). A live `recall` hit renders its `**Links:**` line from the
# body wikilink only (`athenaeum.mcp_server._extract_outbound_links`), so a
# frontmatter-only edge would be readable by a native arm's raw-file grep
# and invisible to Athenaeum's own recall path -- exactly the asymmetry this
# probe class exists to catch, not exhibit.
#
# The surfaced (first-hop) page shares vocabulary with its probe's query,
# same as any other class; the second-hop page's body, uid, name, and tags
# deliberately do NOT -- that is the property `validate_core`'s
# `follow_through` check enforces (including a >=5-char stemmed-prefix check
# over uid/name/tags, since a native arm's topic file is named `<uid>.md`
# and greps on name/tags too), and it is what makes the class un-passable by
# a plain lexical match on the query alone. Each pair plants one distinct
# answer token per page, so a complete answer needs both, and the second-hop
# page always carries its own token.

