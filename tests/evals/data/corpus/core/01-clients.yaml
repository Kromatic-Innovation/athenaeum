  body: |
    # Bluewater Marine

    Bluewater Marine is a coastal logistics operator on a six-month retainer.
    Client lead: Elias Mbeki.

    Retainer terms, verbatim: "Twelve consulting days per month, billed
    monthly in arrears, with unused days carried forward for one month only
    and forfeited thereafter."

