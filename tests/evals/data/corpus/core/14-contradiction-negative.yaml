# contradiction / negative_knowledge probe pairs (issue athenaeum#1781,
# athenaeum#1791 §3.2/§3.3). Invented; see ../README.md for the content
# policy.
#
# --- contradiction (§3.2) ---------------------------------------------------
#
# Two shapes, both graded by `grade_correctness` (answer_tokens cited) AND
# `grade_harm` (forbidden_tokens absent) together -- correct means both hold.
#
# Shape (a), "supersession by an unfound page" (pairs 1-2 below): the query
# lexically reaches a STALE page (same `superseded_by:` convention as
# `05-temporal.yaml`) that carries a forbidden token, linked by a body
# `[[wikilink]]` to a superseding page that carries the answer token and
# shares NO content term with the query -- so nothing but the link/
# `superseded_by:` edge can surface the correct page; the query's own
# vocabulary only ever lands on the stale one.
#
# Shape (b), "deprecated knowledge" (pair 3 below; operator-added scenario,
# athenaeum#1781 comment 2026-09-17): a TASK-phrased prompt lexically
# reaches a stale WORKAROUND page (grep and native find it -- deliberately
# NOT lexically unreachable, the opposite of shape (a) and of the
# `follow_through` class), which carries a forbidden token, linked to a
# retraction/deprecation page that carries the answer token and itself
# links BACK to the stale page. The failure to measure: a keyword search on
# the task lands on the stale workaround and the agent applies it; correct
# behaviour surfaces that the page is superseded and answers from the
# retraction.
#
# --- negative_knowledge (§3.3, use case 2.4) --------------------------------
#
# "We are about to do X again -- what went wrong last time?" The retro/
# lesson page is the answer and is deliberately grep-reachable (the INVERSE
# of the `follow_through` lexical-unreachability check -- a
# `negative_knowledge` probe whose retro page is lexically unreachable is a
# `follow_through` probe filed under the wrong class). A forbidden token
# sits on a separate "naive plan" decoy page that repeats the mistake the
# retro warns against.

# --- contradiction, shape (a): supersession by an unfound page -------------

- uid: policy-expense-approval-stale
  type: note
  name: Expense approval limit (prior policy)
  tags: [finance, superseded]
  source_ref: "session-2025-11-03"
  created: 2025-11-03
  updated: 2026-06-01
  links: [policy-disbursement-ceiling-team-leads]
  superseded_by: "Disbursement Ceiling for Team Leads"
  body: |
    # Expense approval limit (prior policy)

    Under the prior policy, a manager's expense approval limit was governed
    by the Duskwarren tier: spend up to that tier's cap was approved by the
    manager alone, and anything above it required a second sign-off.

    See [[policy-disbursement-ceiling-team-leads]] for the current policy.

