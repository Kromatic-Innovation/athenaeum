- uid: workaround-invoicing-api-pagination
  type: note
  name: Invoicing API pagination workaround
  tags: [engineering, workaround, superseded]
  source_ref: "session-2026-02-18"
  created: 2026-02-18
  updated: 2026-06-10
  links: [notice-invoicing-api-batch-fetch]
  superseded_by: "Invoicing API Batch Fetch Notice"
  body: |
    # Invoicing API pagination workaround

    TASK: when the reporting sync fails with a pagination error from the
    invoicing API, enable the Ashencroft compatibility flag and page
    through results in batches of 50, stitching them together client-side
    before writing the report.

    See [[notice-invoicing-api-batch-fetch]] for the current guidance.

- uid: notice-invoicing-api-batch-fetch
  type: note
  name: Invoicing API Batch Fetch Notice
  tags: [engineering, current, retraction]
  source_ref: "session-2026-06-10"
  created: 2026-06-10
  updated: 2026-06-10
  body: |
    # Invoicing API Batch Fetch Notice

    The invoicing API vendor shipped native batch fetching in June 2026, so
    the manual pagination-stitching workaround described in
    [[workaround-invoicing-api-pagination]] is retired. Call the /batch
    endpoint once instead of paging by hand.

    Internal reference tag: Grimstone.

