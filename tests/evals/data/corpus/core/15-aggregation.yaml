# delivery], "runs delivery for the client portal refresh" -- who already
# satisfied the criterion before this issue and is now in `expected_uids`
# with one appended `Internal reference tag:` line (Quine review of PR
# athenaeum#1810; see this file's header). The near-miss set
# (`meeting-standup`, `project-portal-refresh`, `policy-onboarding` in
# probes.yaml) is left untouched: all three already carry the literal
# `delivery` tag and vocabulary in `core/03-projects-tools.yaml` and
# `core/02-policies.yaml`, which is exactly the false-positive shape this
# probe measures -- a keyword search on "delivery" surfaces a meeting, a
# project, and a policy, none of which is a PERSON the query asks for.

