# aggregation probe class (issue athenaeum#1780, athenaeum#1791 §2.1/§3.4).
#
# Many-correct-answer sets, self-contained in this file so the class's
# fixture never touches a page another probe class's expected_uids/
# must_not_rank already depends on. `grade_coverage` (issue athenaeum#1773)
# grades these by MATCHED FRACTION of `answer_tokens`, not the all-or-nothing
# `grade_correctness` rule -- an answer naming 5 of 6 correct pages here
# scores 5/6, not 0.
#
# Every page below carries its own single planted `Internal reference tag:`
# line, listed in its probe's `answer_tokens` -- `grade_coverage` counts
# fractions of that list, so a probe whose tokens concentrated on one page
# would make "coverage" indistinguishable from ordinary single-hop
# correctness. `must_not_rank` on every probe names REAL, UNEDITED pages
# elsewhere in the core corpus that already share the query's vocabulary
# through their own pre-existing tags/body text (never a phrase invented and
# planted just to manufacture a decoy) -- see each probe's note in
# probes.yaml for the "grep-reachable via:" citation.
#
# report_only: True on all three (athenaeum#1791 §2.1's ruling) -- coverage
# feeds no design-doc §7 condition until an explicit operator ruling on
# athenaeum#1736 promotes the class into CONDITION_2_ENROLLED.

# --- delivery-role people (probe: aggregation_delivery_roles) ---------------
#
# Six people newly authored here, each in a genuinely delivery-facing role.
# The near-miss set (`meeting-standup`, `project-portal-refresh`,
# `policy-onboarding` in probes.yaml) is left untouched: all three already
# carry the literal `delivery` tag and vocabulary in `core/03-projects-tools.yaml`
# and `core/02-policies.yaml`, which is exactly the false-positive shape this
# probe measures -- a keyword search on "delivery" surfaces a meeting, a
# project, and a policy, none of which is a PERSON the query asks for.

