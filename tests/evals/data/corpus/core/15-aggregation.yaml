# aggregation probe class (issue athenaeum#1780, athenaeum#1791 §2.1/§3.4).
#
# Many-correct-answer sets, mostly self-contained in this file so the
# class's fixture never touches a page another probe class's
# expected_uids/must_not_rank already depends on. `grade_coverage` (issue
# athenaeum#1773) grades these by MATCHED FRACTION of `answer_tokens`, not
# the all-or-nothing `grade_correctness` rule -- an answer naming 6 of 7
# correct pages here scores 6/7, not 0.
#
# Every page below carries its own single planted `Internal reference tag:`
# line, listed in its probe's `answer_tokens` -- `grade_coverage` counts
# fractions of that list, so a probe whose tokens concentrated on one page
# would make "coverage" indistinguishable from ordinary single-hop
# correctness. `must_not_rank` on every probe names REAL, UNEDITED pages
# elsewhere in the core corpus that already share the query's vocabulary
# through their own pre-existing tags/body text (never a phrase invented and
# planted just to manufacture a decoy, and never asserted by eye -- see each
# probe's note in probes.yaml, which cites `_content_terms`/
# `_shares_stemmed_term` overlap against the exact query, per Quine review
# of PR athenaeum#1810).
#
# TWO existing pages (`person-lena-varga` in `core/00-people.yaml`,
# `client-castleford` in `core/01-clients.yaml`) each gained exactly one
# appended `Internal reference tag:` body line, per that same review: both
# already genuinely satisfied their probe's criterion by their own
# pre-existing tags/body text, and leaving a page that genuinely qualifies
# out of `expected_uids` entirely is a ground-truth false negative -- the
# one shape this class must never have. No OTHER existing page anywhere in
# the corpus was edited.
#
# report_only: True on all three (athenaeum#1791 §2.1's ruling) -- coverage
# feeds no design-doc §7 condition until an explicit operator ruling on
# athenaeum#1736 promotes the class into CONDITION_2_ENROLLED.

# --- delivery-role people (probe: aggregation_delivery_roles) ---------------
