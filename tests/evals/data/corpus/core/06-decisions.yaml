  tags: [observation, sales]
  source_ref: "session-2026-06-12"
  created: 2026-06-12
  links: [client-solent]
  body: |
    # Proposal turnaround observation

    Proposals issued within a week of first contact convert noticeably better
    than those issued later. Sample is small; treated as a hint, not a rule.

