- uid: note-fob-deactivation
  type: note
  name: Fob deactivation practice
  tags: [note, facilities]
  source_ref: "session-2026-03-04"
  created: 2026-03-04
  links: [policy-office-access, person-oscar-delaney]
  body: |
    # Fob deactivation practice

    Access fobs are deactivated on a leaver's last working day rather than at
    the end of the month, after an audit found three active fobs belonging to
    former staff.
