# Decisions and their rationale. These deepen the link graph so multi-hop
# probes have genuine paths to traverse, and give the corpus the mix of
# decision/observation/policy claim kinds a real tree carries.

- uid: decision-hosting-managed
  type: note
  name: Decision - move portal to managed hosting
  tags: [decision, infrastructure]
  source_ref: "session-2026-05-11"
  created: 2026-05-11
  links: [project-portal-hosting, person-jonas-weir]
  body: |
    # Decision - move portal to managed hosting

    Self-hosting the portal was costing roughly six engineer-days a month in
    maintenance. The decision was to move to managed hosting and accept the
    higher line-item cost. Taken by Jonas Weir with delivery sign-off.

- uid: decision-single-rate
  type: note
  name: Decision - keep a single blended rate
  tags: [decision, pricing]
  source_ref: "session-2026-05-20"
  created: 2026-05-20
  links: [policy-rate-card, project-pricing-review]
  body: |
    # Decision - keep a single blended rate

    Grade-banded rates were considered and rejected: they made proposals
    harder to explain and invited line-by-line negotiation. A single blended
    day rate stays.

- uid: decision-no-client-data-in-notion
  type: note
  name: Decision - no client data in Notion
  tags: [decision, tooling, confidentiality]
  source_ref: "session-2026-01-12"
  created: 2026-01-12
  links: [tool-notion, policy-confidentiality]
  body: |
    # Decision - no client data in Notion

    Notion holds meeting notes and project pages only. Anything
    client-identifying stays out, because the workspace is broadly readable
    internally and confidentiality is a firm value rather than a control.

- uid: decision-quarterly-retros
  type: note
  name: Decision - retros at engagement close, not quarterly
  tags: [decision, delivery]
  source_ref: "session-2026-02-20"
  created: 2026-02-20
  links: [meeting-retro]
  body: |
    # Decision - retros at engagement close, not quarterly

    Quarterly retrospectives were too far from the work to produce specifics.
    Retros now run at engagement close while detail is still recoverable.

- uid: decision-carry-forward-cap
  type: note
  name: Decision - cap PTO carry-forward at five days
  tags: [decision, people]
  source_ref: "session-2026-05-14"
  created: 2026-05-14
  links: [policy-pto, person-sofia-renn]
  body: |
    # Decision - cap PTO carry-forward at five days

    Uncapped carry-forward had built a liability on the balance sheet. Capped
    at five days from FY2026; the rest lapse.

- uid: obs-portal-latency
  type: note
  name: Portal latency observation
  tags: [observation, delivery]
  source_ref: "session-2026-06-03"
  created: 2026-06-03
  links: [project-portal-hosting]
  body: |
    # Portal latency observation

    Portal response times degrade noticeably during month-end invoicing. Not
    yet diagnosed; recorded so the hosting migration can be measured against it.

