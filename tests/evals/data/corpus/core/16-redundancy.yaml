- uid: team-driftgate-oncall
  type: team
  name: Driftgate On-Call Rota
  aliases: [Driftgate rota]
  tags: [rota, support]
  source_ref: "session-2026-07-20"
  created: 2026-07-20
  body: |
    # Driftgate On-Call Rota

    The staffed rota that answers questions about the Driftgate object
    store outside business hours. Two people on shift at a time, rotating
    weekly, with a named escalation contact on call.

    The rota is a standing staffing arrangement, not a phase of the
    migration programme, and it continues after the cutover completes.

# --- Cluster: the Harrowmere Protocol (policy) -------------------------------
#
# Named with an invented anchor word (same device Keelbridge and Driftgate
# use above), not a plain English phrase: an earlier draft of this cluster
# used "payment approval" as the shared vocabulary and lost the FTS5
# coverage invariant (tests/evals/test_recall_covers_grep.py) -- generic
# English words compete against both pre-existing policy pages and this
# probe's OWN generated distractor tier (built from the same
# distractor_terms), diluting the real pages' ranking. An invented proper
# noun repeated across all three cluster pages is what makes Keelbridge's
# and Driftgate's own clusters rank cleanly, so this cluster follows suit.

- uid: policy-dual-signoff
  type: principle
  name: Harrowmere Protocol
  aliases: [Harrowmere, dual sign-off threshold]
  tags: [policy, finance]
  source_ref: "session-2026-04-09"
  created: 2026-04-09
  body: |
    # Harrowmere Protocol

    The Harrowmere Protocol governs payment sign-off across the firm. Any
    payment above 6400 GBP requires two independent approvers before it is
    released under the Harrowmere Protocol; below that figure a single
    approver's sign-off is sufficient.

    The protocol applies to every payment run regardless of which client
    account it is billed against.

    Internal reference tag: Duskbriar.

- uid: policy-dual-signoff-brief
  type: principle
  name: Harrowmere Protocol Brief
  aliases: [Harrowmere brief]
  tags: [policy, onboarding-note]
  source_ref: "session-2026-05-30"
  created: 2026-05-30
  body: |
    # Harrowmere Protocol Brief

    A one-page brief circulated to new finance hires, written independently
    of the firm's own Harrowmere Protocol page. Any payment above 6400 GBP
    requires two independent approvers before release under the protocol; a
    single approver suffices below that figure.

    New hires confirm they have read the brief during their first week.

    Internal reference tag: Emberwick.

- uid: policy-payment-approval-legacy
  type: principle
  name: Legacy Payment Approval Rule (retired)
  aliases: [old approval rule]
  tags: [policy, retired]
  source_ref: "session-2025-11-02"
  created: 2025-11-02
  body: |
    # Legacy Payment Approval Rule (retired)

    The retired single-approver payment rule the Harrowmere Protocol
    replaced. Under the old rule, any payment above 3000 GBP needed the
    finance partner's sign-off alone; no second approver was required.

    Retained here for historical reference only; the Harrowmere Protocol
    documents the current threshold and process separately.

