# Redundancy probe class widening (issue athenaeum#1839).
#
# Before this file the `redundancy` class carried exactly ONE probe
# (`keelbridge_programme_scope`, `08-relatedness.yaml`) at every scale, so a
# single model coin-flip decided design-doc SS7 condition 3 (operator ruling
# on athenaeum#1736). The three clusters below add three more, one each over a
# project, a policy, and a person page, so the class spans page types the way
# every other enrolled class already does.
#
# Unlike Keelbridge -- which is an entity SPLIT (aim/scope/budget on one page,
# phasing/training on the other, so a complete answer needs both HALVES --
# these three clusters are genuine DUPLICATION: each pair states the exact
# same planted fact independently, in its own words, because two different
# sessions wrote the same thing down without knowing about each other. Both
# shapes are "redundancy" in the sense the class measures (retrieval that
# finds only one of the pages a complete answer needs), but this file's shape
# is the one the class was missing.
#
# Each cluster also carries a negative control: a page sharing the cluster's
# name or vocabulary that must NOT be folded in, same reasoning as
# Keelbridge's `team-keelbridge-desk` (ground_truth/relatedness.yaml).
#
# Content policy (data/corpus/README.md): every name, term, and fact below is
# invented outright.

# --- Cluster: Driftgate migration funding (project) -------------------------

- uid: project-driftgate-migration
  type: project
  name: Driftgate Migration
  aliases: [Driftgate programme]
  tags: [project, infrastructure]
  source_ref: "session-2026-06-15"
  created: 2026-06-15
  body: |
    # Driftgate Migration

    Driftgate Migration moves the firm's document archive off the legacy
    file server onto the managed object store. The programme is funded at
    92 thousand GBP per quarter, reviewed by the infrastructure steering
    group.

    The cutover completes in two stages: read-only mirroring, then a hard
    switch once every team confirms its own archive is reachable from the
    new store.

    Internal reference tag: Fenrivet.

