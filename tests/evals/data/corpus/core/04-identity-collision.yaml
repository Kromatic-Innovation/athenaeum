  body: |
    # Devi Hale

    Devi Hale is Rowan Hale's sister and is not employed by the firm. Devi is
    an architect and appears in the record only because she attended the firm's
    2026 anniversary dinner as a guest.

    Devi holds no role, makes no decisions, and owns no accounts here.

