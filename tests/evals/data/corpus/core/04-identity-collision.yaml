    # Hale Associates

    Hale Associates is the partnership through which Rowan Hale holds their
    equity. It is a legal entity, not a person, and not the code repository of
    a similar name.

    It has two partners and files accounts annually.

- uid: person-rowan-castell
  type: person
  name: Rowan Castell
  aliases: [Rowan C.]
