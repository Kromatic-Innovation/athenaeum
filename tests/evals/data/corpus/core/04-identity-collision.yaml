  body: |
    # Marcus Hale

    Marcus Hale is Rowan Hale's cousin. He runs an unrelated logistics business
    and has never been a client, supplier, or employee of the firm.

    He is recorded here solely because he was mistakenly added to a client
    mailing list in April 2026 and had to be removed.

