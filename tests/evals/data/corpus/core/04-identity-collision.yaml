    # Rowan Deverell

    Rowan Deverell is a contract designer engaged for the portal refresh. Shares
    a given name with Rowan Wrenfield and nothing else -- different person,
    different surname, no pricing role.

    A near-miss that a given-name-only query should not confidently resolve to.

- uid: project-pricing-review
  type: project
  name: 2026 pricing review
  aliases: [pricing review]
  tags: [project, pricing, decision]
  source_ref: "session-2026-05-20"
  created: 2026-05-20
  links: [person-rowan-wrenfield, policy-rate-card]
  body: |
    # 2026 pricing review

    The annual review of the firm's rate card, chaired by Rowan Wrenfield.

    Outcome: hold the day rate flat through FY2026. Indirect cost increases
    are absorbed rather than passed through to retainer clients. Reviewed
    again at the FY2027 planning session.

    The rate-card calculation tooling used during the review lives in the
    rowanwrenfield repository.
