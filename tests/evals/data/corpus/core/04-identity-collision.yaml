    # Ilva Wrenfield

    Ilva Wrenfield is Rowan Wrenfield's sister and is not employed by the firm. Ilva is
    an architect and appears in the record only because she attended the firm's
    2026 anniversary dinner as a guest.

    Ilva holds no role, makes no decisions, and owns no accounts here.

