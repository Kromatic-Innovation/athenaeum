# The identity-collision cast.
#
# This file reproduces the STRUCTURE of a real observed retrieval failure --
# a person, a code repository named after that person, and same-surname
# relatives all competing for one name query -- using entirely invented
# entities. The real instance is never named here or anywhere else in the
# repo; see ../README.md.
#
# The failure being guarded against: a query about the PERSON returns the
# REPOSITORY, or a surname-only query returns one confident wrong Hale
# instead of surfacing that several exist.

- uid: person-rowan-hale
  type: person
  name: Rowan Hale
  aliases: [Rowan, R. Hale]
  tags: [person, partner, meridian]
  source_ref: "session-2026-02-03"
  created: 2026-02-03
  updated: 2026-05-20
  links: [org-hale-associates, project-pricing-review, person-devi-hale]
  body: |
    # Rowan Hale

    Rowan Hale is a founding partner at Hale Associates and sits on the
    pricing committee. Rowan owns the firm's relationship with the Meridian
    account and chaired the 2026 pricing review.

    Rowan's decision on pricing, recorded in the pricing review, was to hold
    the day rate flat through the 2026 financial year and absorb the increase
    in indirect costs rather than pass it to retainer clients.

    Not to be confused with the rowanhale code repository, which is named
    after Rowan but is a software project, not a person.

- uid: repo-rowanhale
  type: project
  name: rowanhale
  aliases: [rowanhale repo, the rowanhale repository]
  tags: [repository, software, tooling]
  source_ref: "session-2026-03-11"
  created: 2026-03-11
  updated: 2026-06-02
  links: [person-rowan-hale, tool-buildpipe]
  body: |
    # rowanhale

    rowanhale is an internal code repository holding the firm's rate-card
    calculation tooling. It is named after Rowan Hale, who wrote the first
    version, but the repository is a software project and has no opinions,
    decisions, or pricing authority of its own.

    The repository has 4 maintainers and builds through the buildpipe
    pipeline. Its open issues concern test coverage and a dependency bump.

    A question about what Rowan Hale decided is a question about the PERSON,
    not about this repository.

