# Temporal / knowledge-update pages.
#
# Each pair below has a SUPERSEDED page and a CURRENT one covering the same
# fact. The retrieval assertion is that the current page outranks the stale
# one -- a memory system that returns the superseded answer confidently is
# worse than one that returns nothing, which is why these are their own probe
# class rather than ordinary single-hop cases.

- uid: office-address-current
  type: note
  name: Office address (current)
  aliases: [office address, where is the office]
  tags: [facilities, current]
  source_ref: "session-2026-05-02"
  created: 2026-05-02
  updated: 2026-05-02
  links: [person-oscar-delaney]
  body: |
    # Office address (current)

    The firm's office is at 220 Regent Street, suite 5B. The move completed on
    1 May 2026. Confirmed by Oscar Delaney, office manager, who is the
    authoritative source for this.

    This supersedes the Kingsway address.

- uid: office-address-superseded
  type: note
  name: Office address (former, Kingsway)
  aliases: [Kingsway office]
  tags: [facilities, superseded]
  source_ref: "session-2026-01-10"
  created: 2026-01-10
  updated: 2026-05-02
  links: [office-address-current]
  body: |
    # Office address (former, Kingsway)

    The firm's office was at 14 Kingsway, WeWork floor 3, until April 2026.

    SUPERSEDED: the firm moved to 220 Regent Street on 1 May 2026. Retained for
    historical reference only; do not cite as the current address.

