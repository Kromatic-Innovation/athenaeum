# Temporal / knowledge-update pages.
#
# Each pair below has a SUPERSEDED page and a CURRENT one covering the same
# fact. The retrieval assertion is that the current page outranks the stale
# one -- a memory system that returns the superseded answer confidently is
# worse than one that returns nothing, which is why these are their own probe
# class rather than ordinary single-hop cases.
#
# Issue athenaeum#1493: supersession is marked with the DECLARED ``superseded_by:``
# frontmatter field (pointing at the replacement's ``name:``), not a body-text
# convention. An earlier version of this fixture used a body-text
# ``SUPERSEDED:`` line, which nothing in retrieval ever read -- these pages
# demonstrated only that ranking ignores a body-text convention that was never
# a contract, not that ranking ignores the declared field. The body prose
# below is retained for human readability only; it carries no retrieval
# meaning.

