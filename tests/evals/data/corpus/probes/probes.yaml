# --- long page (issue athenaeum#1779) ---------------------------------------
#
# Probe class stays `single_hop` -- the class is not new, so these enrol in
# design-doc §7 condition 2 the same way every other single_hop probe does
# (`report_only` is left unset here, defaulting to `False` via
# `CONDITION_2_ENROLLED`, and `validate_core` would reject `True` on an
# enrolled class as a corpus error). Each `tier: long` value is metadata for
# filtering only -- parsed onto `Probe.tier`, unused by the grid dispatch --
# an operator who wants to isolate the long-page slice can filter on it
# without touching `probe_class`.

- id: bramfield_retainer_renewal
  probe_class: single_hop
  tier: long
  query: "what is the renewal timeline for the Bramfield Crestwood retainer contract?"
  expected_uids: [client-bramfield-crestwood]
  must_not_rank: [client-alderway]
  distractor_terms: ["Bramfield Crestwood", "retainer renewal", "renewal timeline"]
  answer_tokens: ["Glimmerhollow"]
  note: >-
    Long-page tier (athenaeum#1779). The renewal-cycle question sits in the
    page's title and opening paragraph; the reference tag sits past
    character offset 400, outside `recall`'s 400-character snippet window,
    so a correct answer requires `read_entity` on the full page.
    must_not_rank (athenaeum#1777): Alderway Advisory shares "retainer"
    (both its own tag and body text call it "the firm's largest retainer
    client") but is an unrelated engagement with no renewal-timeline
    content at all.

- id: remote_equipment_stipend_cap
  probe_class: single_hop
  tier: long
  query: "what is the equipment stipend policy for remote employees?"
  expected_uids: [policy-remote-equipment-stipend]
  must_not_rank: [ops-equipment-refresh]
  distractor_terms: ["equipment stipend", "remote employees", "stipend cap"]
  answer_tokens: ["Pallowrift"]
  note: >-
    Long-page tier (athenaeum#1779). Same shape as the retainer probe above:
    the policy topic is in the title, the tag line is past offset 400.
    must_not_rank (athenaeum#1777): the equipment refresh cycle shares
    "equipment" but covers hardware replacement cadence, not the stipend
    policy the query asks about.

- id: lighthouse_migration_rollback
  probe_class: single_hop
  tier: long
  query: "what is the rollback plan for the Lighthouse platform migration project?"
  expected_uids: [project-lighthouse-migration]
  must_not_rank: [project-portal-hosting]
  distractor_terms: ["Lighthouse migration", "rollback plan", "platform migration"]
  answer_tokens: ["Ambervost"]
