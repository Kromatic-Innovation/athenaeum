    replacement's own page (athenaeum#1766) says it exports flat files on a
    nightly cadence for downstream polling rather than pushing updates.
    must_not_rank (athenaeum#1777): "Client reporting rhythm" shares
    "reporting" vocabulary with the query's "reporting tool" but describes
    fortnightly client updates, not the Anchorline tool or its replacement's
    poll-vs-push behaviour. grep-reachable via: reporting.

- id: subsidiary_onboarding_lesson
  probe_class: follow_through
  query: >-
    what went wrong last time we onboarded a client with multiple
    subsidiaries, and did it expose any gap in how we handle payment
    paperwork for them?
  expected_uids: [note-subsidiary-onboarding-retro, policy-cost-center-billing-split]
  must_not_rank: [note-atlas-onboarding-review]
  distractor_terms: ["subsidiaries", "onboarding", "retro"]
  answer_tokens: ["Wrenholt", "Copperfen"]
  note: >-
    Lesson use case (docs/use-cases.md §2.4). The retro names the missed
    contact-record requirement but not the billing rule; only the policy
