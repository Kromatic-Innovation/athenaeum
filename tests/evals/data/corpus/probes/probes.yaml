# Retrieval probes with their ground truth.
#
# `probe_class` follows the LongMemEval-style taxonomy. The taxonomy is
# borrowed; the DATA is not -- those benchmarks test conversational-memory QA
# over dialogue histories, which is a different shape from a compiled wiki.
#
# Fields:
#   expected_uids     pages a correct answer must surface. EMPTY for
#                     abstention probes, where the emptiness IS the assertion.
#   must_not_rank     pages a correct system keeps OUT of the top-k. This is
#                     how a disambiguation probe states the failure it guards.
#   distractor_terms  vocabulary the generated distractor tier uses to build
#                     near-miss pages for this probe. Without these the
#                     generated tier would not compete for rank and the
#                     confusability axis would measure nothing.
#   answer_tokens     (issue athenaeum#1573) a unique, invented token planted
#                     in the body of one of `expected_uids`'s pages, graded by
#                     normalized substring match against a rollout's answer
#                     text. EMPTY for abstention probes, which are graded by a
#                     separate rule (see `tests.evals.north_star_report`).

# --- single hop -------------------------------------------------------------

- id: pto_allowance
  probe_class: single_hop
  query: "what is the firm's PTO allowance?"
  expected_uids: [policy-pto]
  distractor_terms: ["PTO", "annual leave", "holiday allowance"]
  answer_tokens: ["Cinderquill"]

- id: confidentiality_rule
  probe_class: single_hop
  query: "can we share one client's engagement details with another client?"
  expected_uids: [policy-confidentiality]
  distractor_terms: ["confidentiality", "client disclosure"]
  answer_tokens: ["Harrowvex"]

- id: bluewater_terms
  probe_class: single_hop
  query: "quote the Bluewater retainer terms verbatim"
  expected_uids: [client-bluewater]
  distractor_terms: ["Bluewater", "retainer terms"]
  answer_tokens: ["Thornmere"]
  note: >-
    Topic extraction is what rescues the proper noun "Bluewater" from the meta
    instruction "quote ... verbatim". A purely lexical extractor drops it.

- id: onboarding_length
  probe_class: single_hop
  query: "how long does onboarding a new retainer client take?"
  expected_uids: [policy-onboarding]
  distractor_terms: ["onboarding", "kickoff"]
  answer_tokens: ["Larkspindle"]

# --- multi hop --------------------------------------------------------------

- id: spend_approver_named
  probe_class: multi_hop
  query: "who personally signs off discretionary spend over 500 GBP?"
  expected_uids: [policy-budget-approval, person-amir-osei]
  distractor_terms: ["discretionary spend", "approval threshold", "500 GBP"]
  answer_tokens: ["Voltmere"]
  note: >-
    The threshold lives on the policy page and the identity of the finance
    partner on the person page. Retrieving either alone yields a confidently
    incomplete answer, which is why both uids are required.

- id: portal_design_reviewer
  probe_class: multi_hop
  query: "who reviews client-facing surfaces on the portal project?"
  expected_uids: [project-portal-refresh, person-hana-lindqvist]
  distractor_terms: ["portal", "design review"]
  answer_tokens: ["Greywisp"]

- id: ratecard_tooling_owner
  probe_class: multi_hop
  query: "which repository generates the rate card, and who maintains its build?"
  expected_uids: [repo-rowanwrenfield, tool-buildpipe]
  distractor_terms: ["rate card", "build pipeline"]
  answer_tokens: ["Fennorack"]

# --- temporal / knowledge update --------------------------------------------

- id: office_address_current
  probe_class: temporal
  query: "where is our office?"
  expected_uids: [office-address-current]
  must_not_rank: [office-address-superseded]
  distractor_terms: ["office address", "Thornlea Wharf", "Alderway Row"]
  answer_tokens: ["Driftwick"]

- id: standup_time_current
  probe_class: temporal
  query: "what time is the delivery standup?"
  expected_uids: [standup-time-current]
  must_not_rank: [standup-time-superseded]
  distractor_terms: ["standup", "9:00", "9:30"]
  answer_tokens: ["Emberlyn"]

- id: budget_threshold_current
  probe_class: temporal
  query: "what is the client lead approval ceiling?"
  expected_uids: [budget-threshold-current]
  must_not_rank: [budget-threshold-superseded]
  distractor_terms: ["approval ceiling", "250 GBP", "500 GBP"]
  answer_tokens: ["Quorlinth"]

# --- temporal, person/company (issue athenaeum#1744) -------------------------
# The three pairs above all target `note` pages, so none qualifies for the
# relationship-use-case subset (`_relationship_probe_ids` in
# north_star_report.py), which requires `expected_uids` to resolve to a
# `person` or `company` page. These three plant the missing recency facts --
# last-contact date, first-contact date, and a changed-role date -- directly
# on a person/company page instead.

- id: callum_drews_last_contact
  probe_class: temporal
  query: "when did we last speak with Callum Drews?"
  expected_uids: [person-callum-drews]
  must_not_rank: [contact-callum-drews-superseded]
  distractor_terms: ["Callum Drews", "last contact", "last spoke", "2 May 2026"]
  answer_tokens: ["Fenmoor"]

- id: thorncastle_first_contact
  probe_class: temporal
  query: "when did we first start working with Thorncastle?"
  expected_uids: [client-thorncastle]
  must_not_rank: [contact-thorncastle-superseded]
  distractor_terms: ["Thorncastle", "first contact", "became a client", "November 2025"]
  answer_tokens: ["Ashgrove"]

- id: tamsin_ferro_role_change
  probe_class: temporal
  query: "what is Tamsin Ferro's current role, and when did it change?"
  expected_uids: [person-tamsin-ferro]
  must_not_rank: [role-tamsin-ferro-superseded]
  distractor_terms: ["Tamsin Ferro", "promoted", "engagement partner", "associate"]
  answer_tokens: ["Cindervane"]

# --- disambiguation ---------------------------------------------------------
# The class this corpus exists for. Each of these guards a person-vs-artifact
# or person-vs-namesake confusion.

- id: person_not_repo
  probe_class: disambiguation
  query: "what did Rowan Wrenfield decide about pricing?"
  expected_uids: [person-rowan-wrenfield, project-pricing-review]
  must_not_rank: [repo-rowanwrenfield]
  distractor_terms: ["Rowan Wrenfield", "rowanwrenfield", "pricing"]
  answer_tokens: ["Ashcaldera"]
  note: >-
    A decision is made by a PERSON. The eponymous repository shares almost all
    of the query's vocabulary and must not outrank the person page.

- id: repo_not_person
  probe_class: disambiguation
  query: "how many maintainers does the rowanwrenfield repository have?"
  expected_uids: [repo-rowanwrenfield]
  must_not_rank: [person-rowan-wrenfield]
  distractor_terms: ["rowanwrenfield", "maintainers", "repository"]
  answer_tokens: ["Brindlewake"]
  note: The inverse direction -- the guard must not simply always prefer people.

- id: surname_is_ambiguous
  probe_class: disambiguation
  query: "tell me about Wrenfield"
  expected_uids: [person-rowan-wrenfield, person-ilva-wrenfield, person-tovah-wrenfield]
  distractor_terms: ["Wrenfield", "Wrenfield Associates"]
  answer_tokens: ["Hollowmarsh"]
  note: >-
    A bare surname is genuinely ambiguous across several people plus an org.
    The correct behaviour is to surface the ambiguity, not to answer
    confidently about one Wrenfield. Scored on distinct-page count, not a single hit.

- id: given_name_is_ambiguous
  probe_class: disambiguation
  query: "who is Rowan?"
  expected_uids: [person-rowan-wrenfield, person-rowan-deverell]
  distractor_terms: ["Rowan"]
  answer_tokens: ["Sablethorn"]

# --- abstention -------------------------------------------------------------
# Nothing in the corpus answers these. Returning a confident wrong page is the
# failure being measured; returning nothing is the correct behaviour. This is
# where a push sidecar does its real damage and it is currently untested.

- id: abstain_unknown_client
  probe_class: abstention
  query: "what are the payment terms for Harrowgate Industrial?"
  distractor_terms: ["payment terms", "industrial client"]
  note: Harrowgate Industrial does not exist in the corpus.

- id: abstain_unknown_policy
  probe_class: abstention
  query: "what is the firm's parental leave policy?"
  distractor_terms: ["parental leave", "leave policy"]
  note: >-
    Adjacent to the PTO policy in vocabulary but genuinely absent. A system
    that returns the PTO page here has confabulated by retrieval.

- id: abstain_unknown_person
  probe_class: abstention
  query: "what is Yusuf Adeyemi responsible for?"
  distractor_terms: ["responsible for", "role"]

# --- distractor robustness --------------------------------------------------

- id: acme_billing_exception
  probe_class: distractor_robustness
  query: "how is Acme billed?"
  expected_uids: [client-acme]
  must_not_rank: [policy-invoice-cadence]
  distractor_terms: ["invoice", "billing", "milestone"]
  answer_tokens: ["Kestrelgate"]
  note: >-
    The general cadence policy is a strong lexical match and the WRONG answer:
    Acme is a documented exception to it.

- id: former_client_not_current
  probe_class: distractor_robustness
  query: "which clients are currently on retainer?"
  expected_uids: [client-alderway, client-bluewater, client-atlas]
  must_not_rank: [client-verity, client-solent]
  distractor_terms: ["retainer", "client"]
  answer_tokens: ["Trevanquil"]
  note: Verity is a former client and Solent only a prospect.

# --- redundancy -------------------------------------------------------------
#
# Issue athenaeum#1570. Unlike every class above, this probe's ground truth is
# an entity that DOES NOT EXIST as a page: the consolidated Keelbridge
# programme is split across `project-keelbridge` (aim, scope, budget) and
# `project-keelbridge-rollout` (phasing, training, switch-off). A complete
# answer needs both, and that is what makes the split cost something a
# retrieval measure can see, rather than merely being untidy.
#
# `must_not_rank` carries the negative control: the Keelbridge Desk is a
# staffing rota, not a phase of the programme, and a system that returns it
# here has matched on the shared name rather than on the question.

- id: keelbridge_programme_scope
  probe_class: redundancy
  query: "what does the Keelbridge programme cover?"
  expected_uids: [project-keelbridge, project-keelbridge-rollout]
  must_not_rank: [team-keelbridge-desk]
  distractor_terms: ["Keelbridge", "programme", "berth scheduling"]
  answer_tokens: ["Vulmarsh"]
  note: >-
    Redundancy probe. Both expected pages are the SAME entity written down
    twice; retrieving only one is the measurable cost of the entity split,
    and `tests/test_eval_corpus_relatedness.py` pins that asymmetry as the
    corpus's current (wrong) state so a consolidation change has something to
    move.

# --- follow-through ----------------------------------------------------------
#
# Issue athenaeum#1737. The class a plain grep cannot pass by accident: the
# query surfaces one page, and the complete answer requires opening it and
# following its body `[[wikilink]]` (not just the `related`/`links`
# frontmatter authored alongside it) to a SECOND page the query's own terms
# never reach. `validate_core` enforces every half -- the tokens split
# across the two pages, the source page itself reachable from the query, the
# qualifying edge being body-visible, and the second-hop page's body/uid/
# name/tags disjoint from `query` -- so a probe here cannot silently degrade
# into `multi_hop`, or into a shape grep can pass and Athenaeum cannot.
# Spans the four use cases in `docs/use-cases.md` §2: relationship (2.1),
# rationale (2.2), decision (2.3), lesson (2.4).

- id: fenwick_relationship_history
  probe_class: follow_through
  query: "what is our relationship with Fenwick Systems?"
  expected_uids: [client-fenwick-systems, person-dara-holt]
  distractor_terms: ["Fenwick Systems", "retainer client", "relationship"]
  answer_tokens: ["Quillbrook", "Marrowfen"]
  note: >-
    Relationship use case (docs/use-cases.md §2.1). The client page names the
    engagement lead; the renegotiation detail lives only on her own page,
    reached by following the client page's link.

- id: corvale_holdings_history
  probe_class: follow_through
  query: "what is our history with Corvale Holdings?"
  expected_uids: [client-corvale-holdings, project-platform-cutover-programme]
  distractor_terms: ["Corvale Holdings", "retainer client", "migration"]
  answer_tokens: ["Halvorwick", "Ossmarl"]
  note: >-
    Relationship use case (docs/use-cases.md §2.1). The client page names the
    migration programme; the cutover-delay detail lives only on the
    programme's own page.

- id: pinemarsh_goal_rationale
  probe_class: follow_through
  query: "what is the goal behind the Pinemarsh initiative?"
  expected_uids: [project-pinemarsh-initiative, decision-tooling-budget-cap]
  distractor_terms: ["Pinemarsh initiative", "goal", "tooling consolidation"]
  answer_tokens: ["Tanglewrought", "Fendrickal"]
  note: >-
    Rationale use case (docs/use-cases.md §2.2). The initiative page states
    the goal and links to the budget decision it forced; the cap figure
    lives only on the decision page.

- id: gilcrest_vendor_decision
  probe_class: follow_through
  query: "why did we choose Gilcrest as the ticketing vendor?"
  expected_uids: [decision-ticketing-vendor-gilcrest, person-mireille-santos]
  distractor_terms: ["Gilcrest", "ticketing vendor", "pricing"]
  answer_tokens: ["Oakenspire", "Brindlemoor"]
  note: >-
    Decision use case (docs/use-cases.md §2.3, "who made this call?"). The
    decision page gives the pricing rationale and links to who signed the
    contract; the price-lock detail lives only on her own page.

- id: anchorline_retirement_rationale
  probe_class: follow_through
  query: "why did we retire the Anchorline reporting tool?"
  expected_uids: [decision-retire-anchorline, system-ledgerfax-successor]
  distractor_terms: ["Anchorline", "retire", "reporting tool"]
  answer_tokens: ["Verdantholt", "Sablecroft"]
  note: >-
    Decision use case (docs/use-cases.md §2.3). The decision page gives the
    security rationale and links to the replacement tool; its export-cadence
    detail lives only on the replacement's own page.

- id: subsidiary_onboarding_lesson
  probe_class: follow_through
  query: "what went wrong last time we onboarded a client with multiple subsidiaries?"
  expected_uids: [note-subsidiary-onboarding-retro, policy-cost-center-billing-split]
  distractor_terms: ["subsidiaries", "onboarding", "retro"]
  answer_tokens: ["Wrenholt", "Copperfen"]
  note: >-
    Lesson use case (docs/use-cases.md §2.4). The retro names the missed
    contact-record requirement and links to the billing policy it exposed a
    gap in; the confirmation rule lives only on the policy page.
