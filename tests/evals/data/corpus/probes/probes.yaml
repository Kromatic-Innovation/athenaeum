# Retrieval probes with their ground truth.
#
# `probe_class` follows the LongMemEval-style taxonomy. The taxonomy is
# borrowed; the DATA is not -- those benchmarks test conversational-memory QA
# over dialogue histories, which is a different shape from a compiled wiki.
#
# Fields:
#   expected_uids     pages a correct answer must surface. EMPTY for
#                     abstention probes, where the emptiness IS the assertion.
#   must_not_rank     pages a correct system keeps OUT of the top-k. This is
#                     how a disambiguation probe states the failure it guards.
#   distractor_terms  vocabulary the generated distractor tier uses to build
#                     near-miss pages for this probe. Without these the
#                     generated tier would not compete for rank and the
#                     confusability axis would measure nothing.
#   answer_tokens     (issue athenaeum#1573) a unique, invented token planted
#                     in the body of one of `expected_uids`'s pages, graded by
#                     normalized substring match against a rollout's answer
#                     text. EMPTY for abstention probes, which are graded by a
#                     separate rule (see `tests.evals.north_star_report`).

# --- single hop -------------------------------------------------------------

- id: pto_allowance
  probe_class: single_hop
  query: "what is the firm's PTO allowance?"
  expected_uids: [policy-pto]
  must_not_rank: [pto-allowance-superseded]
  distractor_terms: ["PTO", "annual leave", "holiday allowance"]
  answer_tokens: ["Cinderquill"]
  note: >-
    must_not_rank (athenaeum#1777): the superseded temporal note shares almost
    all of "PTO allowance" vocabulary and titles itself with the current
    figure's own former value -- a stale answer a keyword search plausibly
    surfaces. grep-reachable via: pto, allowance.

- id: confidentiality_rule
  probe_class: single_hop
  query: "can we share one client's engagement details with another client?"
  expected_uids: [policy-confidentiality]
  must_not_rank: [client-northgate]
  distractor_terms: ["confidentiality", "client disclosure"]
  answer_tokens: ["Harrowvex"]
  note: >-
    must_not_rank (athenaeum#1777): Northgate's own page shares "client" and
    "engagement" with the query and states it "carries additional
    confidentiality terms beyond the firm's standard" -- a plausible near
    match that never states the firm-wide cross-client disclosure rule the
    query asks for. grep-reachable via: engagement.

- id: bluewater_terms
  probe_class: single_hop
  query: "quote the Bluewater retainer terms verbatim"
  expected_uids: [client-bluewater]
  distractor_terms: ["Bluewater", "retainer terms"]
  must_not_rank: [obs-retainer-utilisation]
  answer_tokens: ["Thornmere"]
  note: >-
    Topic extraction is what rescues the proper noun "Bluewater" from the meta
    instruction "quote ... verbatim". A purely lexical extractor drops it.
    must_not_rank (athenaeum#1777): the utilisation observation shares
    "Bluewater" and "retainer" vocabulary but carries a usage statistic, not
    the verbatim retainer terms the query asks to be quoted. grep-reachable
    via: bluewater, retainer.

- id: onboarding_length
  probe_class: single_hop
  query: "how long does onboarding a new retainer client take?"
  expected_uids: [policy-onboarding]
  must_not_rank: [note-atlas-onboarding-review]
  distractor_terms: ["onboarding", "kickoff"]
  answer_tokens: ["Larkspindle"]
  note: >-
    must_not_rank (athenaeum#1777): the Atlas onboarding review shares
    "onboarding" vocabulary heavily and reads like a plausible answer, but it
    is the case study that prompted the policy change, not the duration
    itself. grep-reachable via: onboarding, client.

# --- multi hop --------------------------------------------------------------

- id: spend_approver_named
  probe_class: multi_hop
  query: >-
    who signs off discretionary spend over 500 GBP, and will he clear it by
    email alone or does he insist on a direct conversation first?
  expected_uids: [policy-budget-approval, person-amir-osei]
  must_not_rank: [budget-threshold-current]
  distractor_terms: ["discretionary spend", "500 GBP", "direct conversation"]
  answer_tokens: ["Voltmere"]
  note: >-
    The threshold and the finance partner's name (athenaeum#1768) live on the
    policy page; only his own page says he refuses to act on a written note
    alone and insists on hearing the request in person before agreeing.
    Retrieving either page alone yields a confidently incomplete answer,
    which is why both uids are required.
    must_not_rank (athenaeum#1777): the temporal "current threshold" note
    restates the same 500 GBP ceiling with heavy vocabulary overlap but never
    names who personally signs off -- half an answer to a probe that requires
    the name. grep-reachable via: 500, gbp.

- id: portal_design_reviewer
  probe_class: multi_hop
  query: >-
    who reviews client-facing surfaces on the portal project, and does that
    review happen only once before launch, or does the reviewer check back
    again after it ships?
  expected_uids: [project-portal-refresh, person-hana-lindqvist]
  must_not_rank: [project-portal-hosting]
  distractor_terms: ["portal", "launch"]
  answer_tokens: ["Greywisp"]
  note: >-
    The project page names the design lead (athenaeum#1768); only her own
    page says the review is not a one-time launch gate -- she revisits every
    shipped screen a month afterward to confirm it still meets her bar.
    must_not_rank (athenaeum#1777): the hosting-migration workstream shares
    "portal" vocabulary strongly but is about infrastructure, not the
    client-facing design review the query asks about. grep-reachable via:
    portal.

- id: ratecard_tooling_owner
  probe_class: multi_hop
  query: >-
    which repository generates the rate card, and who would need to be
    looped in if the system behind it stopped working?
  expected_uids: [repo-rowanwrenfield, tool-buildpipe]
  must_not_rank: [tool-gridbook]
  distractor_terms: ["rate card", "stopped working"]
  answer_tokens: ["Fennorack"]
  note: >-
    The repository page identifies which repo produces the rate card
    (athenaeum#1768); who to loop in if its build tooling breaks is only on
    the buildpipe page (Tomas Briell). Reworded from the original wording,
    which shared the literal words "rate", "card", and "build" with the
    buildpipe page and so was reachable by the query's own vocabulary
    without following the hop.
    must_not_rank (athenaeum#1777): Gridbook's own page names both "rate
    card" and the rowanwrenfield tooling, an almost-complete vocabulary
    match, but Gridbook is the spreadsheet the rate card is generated INTO,
    not the repository that generates it or its build owner. grep-reachable
    via: rate, card.

