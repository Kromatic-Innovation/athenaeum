# --- disambiguation ---------------------------------------------------------
# The class this corpus exists for. Each of these guards a person-vs-artifact
# or person-vs-namesake confusion.

- id: person_not_repo
  probe_class: disambiguation
  query: "what did Rowan Wrenfield decide about pricing?"
  expected_uids: [person-rowan-wrenfield, project-pricing-review]
  must_not_rank: [repo-rowanwrenfield]
  distractor_terms: ["Rowan Wrenfield", "rowanwrenfield", "pricing"]
  answer_tokens: ["Ashcaldera"]
  note: >-
    A decision is made by a PERSON. The eponymous repository shares almost all
    of the query's vocabulary and must not outrank the person page.
    grep-reachable via: rowan, wrenfield.

- id: repo_not_person
  probe_class: disambiguation
  query: "how many maintainers does the rowanwrenfield repository have?"
  expected_uids: [repo-rowanwrenfield]
  must_not_rank: [person-rowan-wrenfield]
  distractor_terms: ["rowanwrenfield", "maintainers", "repository"]
  answer_tokens: ["Brindlewake"]
  note: >-
    The inverse direction -- the guard must not simply always prefer people.
    grep-reachable via: rowanwrenfield.

- id: surname_is_ambiguous
  probe_class: disambiguation
  query: "tell me about Wrenfield"
  expected_uids: [person-rowan-wrenfield, person-ilva-wrenfield, person-tovah-wrenfield]
  must_not_rank: [org-wrenfield-associates]
  distractor_terms: ["Wrenfield", "Wrenfield Associates"]
  answer_tokens: ["Hollowmarsh"]
  note: >-
    A bare surname is genuinely ambiguous across several people plus an org.
    The correct behaviour is to surface the ambiguity, not to answer
    confidently about one Wrenfield. Scored on distinct-page count, not a single hit.
    must_not_rank (athenaeum#1777): the partnership entity is a literal-text
    "Wrenfield" match but is a company, not one of the ambiguous people the
    query is genuinely asking to disambiguate among. grep-reachable via:
    wrenfield.

- id: given_name_is_ambiguous
  probe_class: disambiguation
  query: "who is Rowan?"
  expected_uids: [person-rowan-wrenfield, person-rowan-deverell]
  must_not_rank: [project-pricing-review]
  distractor_terms: ["Rowan"]
  answer_tokens: ["Sablethorn"]
  note: >-
    must_not_rank (athenaeum#1777): the pricing review's body names "Rowan
    Wrenfield" twice, so a keyword search on "Rowan" plausibly surfaces it --
    but it is a project page describing an outcome, not a page that answers
    who Rowan is. grep-reachable via: rowan.

# --- abstention -------------------------------------------------------------
# Nothing in the corpus answers these. Returning a confident wrong page is the
# failure being measured; returning nothing is the correct behaviour. This is
# where a push sidecar does its real damage and it is currently untested.

- id: abstain_unknown_client
  probe_class: abstention
  query: "what are the payment terms for Harrowgate Industrial?"
  distractor_terms: ["payment terms", "industrial client"]
  note: Harrowgate Industrial does not exist in the corpus.

- id: abstain_unknown_policy
  probe_class: abstention
  query: "what is the firm's parental leave policy?"
  distractor_terms: ["parental leave", "leave policy"]
  note: >-
    Adjacent to the PTO policy in vocabulary but genuinely absent. A system
    that returns the PTO page here has confabulated by retrieval.

- id: abstain_unknown_person
  probe_class: abstention
  query: "what is Yusuf Adeyemi responsible for?"
  distractor_terms: ["responsible for", "role"]

# --- distractor robustness --------------------------------------------------

- id: acme_billing_exception
  probe_class: distractor_robustness
  query: "how is Acme billed?"
  expected_uids: [client-acme]
  must_not_rank: [policy-invoice-cadence]
  distractor_terms: ["invoice", "billing", "milestone"]
  answer_tokens: ["Kestrelgate"]
  note: >-
    The general cadence policy is a strong lexical match and the WRONG answer:
    Acme is a documented exception to it. grep-reachable via: acme.

- id: former_client_not_current
  probe_class: distractor_robustness
  query: "which clients are currently on retainer?"
  expected_uids: [client-alderway, client-bluewater, client-atlas]
  must_not_rank: [client-verity, client-solent]
  distractor_terms: ["retainer", "client"]
  answer_tokens: ["Trevanquil"]
  note: >-
    Verity is a former client and Solent only a prospect. grep-reachable via:
    client-verity: retainer; client-solent: client (stemmed, "clients" vs
    "client").

# --- redundancy -------------------------------------------------------------
#
# Issue athenaeum#1570. Unlike every class above, this probe's ground truth is
# an entity that DOES NOT EXIST as a page: the consolidated Keelbridge
# programme is split across `project-keelbridge` (aim, scope, budget) and
# `project-keelbridge-rollout` (phasing, training, switch-off). A complete
# answer needs both, and that is what makes the split cost something a
# retrieval measure can see, rather than merely being untidy.
#
# `must_not_rank` carries the negative control: the Keelbridge Desk is a
# staffing rota, not a phase of the programme, and a system that returns it
# here has matched on the shared name rather than on the question.

- id: keelbridge_programme_scope
  probe_class: redundancy
  query: "what does the Keelbridge programme cover?"
  expected_uids: [project-keelbridge, project-keelbridge-rollout]
  must_not_rank: [team-keelbridge-desk]
  distractor_terms: ["Keelbridge", "programme", "berth scheduling"]
  answer_tokens: ["Vulmarsh"]
  note: >-
    Redundancy probe. Both expected pages are the SAME entity written down
    twice; retrieving only one is the measurable cost of the entity split,
    and `tests/test_eval_corpus_relatedness.py` pins that asymmetry as the
    corpus's current (wrong) state so a consolidation change has something to
    move. grep-reachable via: keelbridge, programme.

# --- follow-through ----------------------------------------------------------
#
# Issue athenaeum#1737. The class a plain grep cannot pass by accident: the
# query surfaces one page, and the complete answer requires opening it and
# following its body `[[wikilink]]` (not just the `related`/`links`
# frontmatter authored alongside it) to a SECOND page the query's own terms
# never reach. `validate_core` enforces every half -- the tokens split
# across the two pages, the source page itself reachable from the query, the
# qualifying edge being body-visible, and the second-hop page's body/uid/
# name/tags disjoint from `query` -- so a probe here cannot silently degrade
# into `multi_hop`, or into a shape grep can pass and Athenaeum cannot.
# Spans the four use cases in `docs/use-cases.md` §2: relationship (2.1),
# rationale (2.2), decision (2.3), lesson (2.4).

- id: fenwick_relationship_history
  probe_class: follow_through
  query: >-
    what is our relationship with Fenwick Systems, and is there a recurring
    checkpoint on the account that could change its terms?
  expected_uids: [client-fenwick-systems, person-dara-holt]
  distractor_terms: ["Fenwick Systems", "retainer client", "relationship"]
  answer_tokens: ["Quillbrook", "Marrowfen"]
  note: >-
    Relationship use case (docs/use-cases.md §2.1). The client page names the
    engagement lead but says nothing about a recurring checkpoint; only her
    own page (athenaeum#1766) says she reviews cost-escalation clauses each
    spring and flags renegotiation before the March budget cycle, reached by
    following the client page's link.
    precision: n/a (athenaeum#1777) -- "Fenwick Systems" and "Dara Holt" are
    invented names that share no meaningful vocabulary with any other core
    page; the generic "retainer client" phrase alone is too broad to name a
    single plausible false positive without inventing one, which this audit
    is not permitted to do.

- id: corvale_holdings_history
  probe_class: follow_through
  query: >-
    what is our history with Corvale Holdings, and how has any current work
    with them gone against plan?
  expected_uids: [client-corvale-holdings, project-platform-cutover-programme]
  distractor_terms: ["Corvale Holdings", "retainer client", "migration"]
  answer_tokens: ["Halvorwick", "Ossmarl"]
  note: >-
    Relationship use case (docs/use-cases.md §2.1). The client page names the
    migration programme but says nothing about it slipping; only the
    programme's own page (athenaeum#1766) carries the six-week cutover delay
    from the vendor's quarterly freeze.
    precision: n/a (athenaeum#1777) -- the query (see above) never contains
    "migration" after the athenaeum#1768 reword, so the previously-authored
    `project-portal-hosting` must_not_rank had zero exact or stemmed
    content-term overlap with it (`_content_terms`/`_shares_stemmed_term`
    checked directly; Quine review of PR athenaeum#1801 caught this) and was
    a fabricated negative. No other core page shares more than a single
    generic word ("client"/"current") with this query, which is not enough
    to be a plausible grep false positive without inventing one.

- id: pinemarsh_goal_rationale
  probe_class: follow_through
  query: >-
    what is the goal behind the Pinemarsh initiative, and was any constraint
    imposed on it because of a past track record?
  expected_uids: [project-pinemarsh-initiative, decision-tooling-budget-cap]
  distractor_terms: ["Pinemarsh initiative", "goal", "tooling consolidation"]
  answer_tokens: ["Tanglewrought", "Fendrickal"]
  note: >-
    Rationale use case (docs/use-cases.md §2.2). The initiative page states
    the goal but not the constraint; only the decision page (athenaeum#1766)
    carries the forty-engineer-day cap set after a prior consolidation effort
    ran three times over its original estimate.
    precision: n/a (athenaeum#1777) -- "Pinemarsh" is an invented, unique
    name. The only other page sharing "tooling" (policy-tooling-procurement)
    covers software-purchase approval with no overlap on "goal",
    "consolidation", or "constraint" -- too weak to be a plausible grep false
    positive.

- id: gilcrest_vendor_decision
  probe_class: follow_through
  query: >-
    why did we choose Gilcrest as the ticketing vendor, and did the
    arrangement guard against cost changes down the road?
  expected_uids: [decision-ticketing-vendor-gilcrest, person-mireille-santos]
  must_not_rank: [decision-retire-anchorline]
  distractor_terms: ["Gilcrest", "ticketing vendor", "pricing"]
  answer_tokens: ["Oakenspire", "Brindlemoor"]
  note: >-
    Decision use case (docs/use-cases.md §2.3, "who made this call?"). The
    decision page gives the pricing rationale but not the contract terms;
    only her own page (athenaeum#1766) carries the two-year price lock
    negotiated after the initial quote came in above budget.
    must_not_rank (athenaeum#1777): the only other "Decision - ... vendor"
    shaped page in the corpus, sharing the generic "vendor" term and the
    "Decision -" title pattern, but it is about Anchorline's retirement, not
    Gilcrest's selection or its price-lock terms. grep-reachable via: vendor.

- id: anchorline_retirement_rationale
  probe_class: follow_through
  query: >-
    why did we retire the Anchorline reporting tool, and does the
    replacement expect anyone querying it to check back regularly instead
    of getting pushed updates?
  expected_uids: [decision-retire-anchorline, system-ledgerfax-successor]
  must_not_rank: [ops-client-reporting]
  distractor_terms: ["Anchorline", "retire", "reporting tool"]
  answer_tokens: ["Verdantholt", "Sablecroft"]
  note: >-
    Decision use case (docs/use-cases.md §2.3). The decision page gives the
