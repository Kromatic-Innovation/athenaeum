# Relatedness and redundancy ground truth (issue athenaeum#1570).
#
# Deliberately NOT authored into the pages themselves. The whole value of the
# Cluster A fixture is that the edges are ABSENT from the corpus: a corpus
# that already carries them cannot tell a librarian that writes edges from one
# that does not, in either direction.
#
# Loaded by ``tests.evals.corpus.load_unlinked_clusters`` /
# ``load_redundant_clusters``; every uid here is checked against the corpus by
# ``validate_core``, so a typo is a corpus error rather than a silent MISS.

unlinked_clusters:
  - id: quiet-handover
    note: >-
      One concept at three altitudes: the thing, a model OF the thing, and a
      process EMBODYING it. Zero edges between them in the corpus as
      committed; the three below are what a librarian that writes relatedness
      should produce. The roles are recorded but NOT graded -- see
      ``tests/evals/relatedness.py`` for why.
    members:
      - concept-quiet-handover
      - model-handover-ladder
      - process-shadow-fortnight
    expected_edges:
      - source: model-handover-ladder
        target: concept-quiet-handover
        role: models
      - source: process-shadow-fortnight
        target: concept-quiet-handover
        role: embodies
      - source: process-shadow-fortnight
        target: model-handover-ladder
        role: implements

  - id: person-company-project
    note: >-
      Issue athenaeum#1658 (a child of athenaeum#1600 AC3): a client-engagement
      triangle -- a person who works at a company, the company that
      commissioned a project, and the project itself. Zero edges between them
      in the corpus as committed, same reasoning as ``quiet-handover`` above.
      This cluster ALSO carries a fact-placement assertion (``fact_placements``
      below), which ``quiet-handover`` does not: the person's page holds a
      payment fact that belongs on the project instead. That half is graded
      by ``tests/evals/fact_placement.py``, not ``tests/evals/relatedness.py``.
    members:
      - person-dara-featherstone
      - company-corvane-robotics
      - project-corvane-automation-rollout
    expected_edges:
      - source: person-dara-featherstone
        target: company-corvane-robotics
        role: works_at
      - source: company-corvane-robotics
        target: project-corvane-automation-rollout
        role: commissioned
      - source: project-corvane-automation-rollout
        target: person-dara-featherstone
        role: point_of_contact
    fact_placements:
      - fact_id: corvane-milestone-three-payment
        marker: "INV-CRV-0483"
        correct_on: project-corvane-automation-rollout
        misplaced_on: person-dara-featherstone
        note: >-
          The milestone-three payment is authored on the person's page (under
          "## Fundraising Pipeline"), which is where the live-shape defect
          puts it. A librarian that gets fact placement right would carry it
          on the project page instead -- or a sub-page linked from it -- and
          never leave it on the person.

redundant_clusters:
  - id: keelbridge
    note: >-
      The classic entity-split signature: a bare name, the same name with a
      parenthetical qualifier, and an associated team page. The first two are
      one programme written down twice and should consolidate. The team page
      is a standing staffing arrangement that outlives the programme -- it is
      the NEGATIVE CONTROL, and a consolidation pass that swallows it has
      over-merged. The merge verdict itself is graded in athenaeum#1577; what
      is graded here is the retrieval cost of the split.
    merge:
      - project-keelbridge
      - project-keelbridge-rollout
    negative_control:
      - team-keelbridge-desk
    probe: keelbridge_programme_scope

  - id: driftgate-migration-funding
    note: >-
      Issue athenaeum#1839. Unlike Keelbridge above (an entity SPLIT), this is
      genuine DUPLICATION: the programme's own page and an independently
      written status note both state the same quarterly funding figure. The
      on-call rota shares the Driftgate name but is a standing staffing
      arrangement, not a phase of the migration -- the NEGATIVE CONTROL, same
      reasoning as Keelbridge's team page.
    merge:
      - project-driftgate-migration
      - project-driftgate-migration-status
    negative_control:
      - team-driftgate-oncall
    probe: driftgate_migration_funding

  - id: dual-signoff-threshold
    note: >-
      Issue athenaeum#1839. The firm's own Harrowmere Protocol page and a
      new-hire brief were written up independently and both state the same
      6400 GBP dual-approval threshold. The retired single-approver rule
      shares "Harrowmere Protocol" vocabulary (it names the protocol that
      replaced it) but names a DIFFERENT, superseded threshold -- the
      NEGATIVE CONTROL: a consolidation pass that swallows it would fold a
      dead rule into the live one.
    merge:
      - policy-dual-signoff
      - policy-dual-signoff-brief
    negative_control:
      - policy-payment-approval-legacy
    probe: dual_signoff_threshold

  - id: mira-castellane-role
    note: >-
      Issue athenaeum#1839. Mira Castellane's own profile and a directory
      listing captured independently both state the same Rivencourt practice
      and start date. Castellane Group shares only the surname -- a
      different entity entirely -- and is the NEGATIVE CONTROL: a
      consolidation pass that swallows it has matched on name alone, not on
      identity.
    merge:
      - person-mira-castellane
      - person-mira-castellane-directory
    negative_control:
      - company-castellane-group
    probe: mira_castellane_role
