# Recall-metrics gold set: invented example (athenaeum#2611).
# Design and field meanings: docs/design/recall-metrics.md.
# Every task is invented over the synthetic eval corpus under
# tests/evals/data/corpus/ (see its README for the content policy). `reach`
# records whether a push built from the task text could plausibly surface the
# page (lexical) or only a link from another page could (linked); the decoy
# pages the corpus plants ("safe to do it" notes) are deliberately NOT labelled
# relevant. No task carries a session_id: the example is a schema/format
# fixture, not a measurement.
version: 1
corpus: tests/evals/data/corpus/core
tasks:
