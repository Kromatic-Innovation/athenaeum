# Counter-example fixture (athenaeum#1960 AC3a): the lock pins a direct
# dependency OUTSIDE its declared pyproject range. This pair must make
# check_parity() report exactly one violation, for mcp specifically.
[project]
name = "demo"
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.24,<2.0",
]
vector = [
    "chromadb>=0.5.0,<2.0",
]
