# Seeded-layers manifest — issue #551 (audit finding H13).
#
# WHAT THIS IS: the durable record of which recorded-fixture layers have
# *ever* been seeded by an `evals.yml` run with `record=true`. It exists so
# the replay suite (`tests/test_recorded_fixtures.py`) can distinguish two
# states an empty directory alone cannot:
#
#   - never seeded  → nothing has been recorded yet; an empty layer directory
#                     passes trivially (the state at PR-merge time). Correct.
#   - seeded, lost  → fixtures existed and were deleted or dropped in a merge;
#                     an empty directory is now a SILENT COVERAGE HOLE (H13).
#                     The replay suite fails hard for such a layer.
#
# A layer is "seeded" iff it appears as a key under `seeded:` below. A seeded
# layer MUST keep a non-empty `tests/fixtures/recorded/<layer>/` directory or
# `test_seeded_manifest_layers_are_populated` fails, naming the layer and
# pointing at the record command in `tests/evals/README.md`.
#
# SHIPS EMPTY (issue #551). With `seeded: {}` the replay suite behaves exactly
# as before this issue — every layer directory is empty and every layer is
# absent from the manifest, so all replay tests pass trivially and zero-key
# `develop` CI stays green. Issue #610 (operator: run `evals.yml record=true`
# with a live `ANTHROPIC_API_KEY`) is what appends the first entry.
#
# FORMAT: a top-level `seeded:` mapping, layer-name -> metadata. Each metadata
# block records when the layer was first seeded and which workflow run produced
# the fixtures, so the audit trail lives with the manifest. #610 appends like:
#
#   seeded:
#     detector:
#       date: 2026-08-05                    # ISO date of the seeding run
#       run: https://github.com/Kromatic-Innovation/athenaeum/actions/runs/<id>
#
# Known layer names: detector, resolver, recall, backfill (see
# tests/evals/harness.py LAYER_* constants).
seeded: {}
