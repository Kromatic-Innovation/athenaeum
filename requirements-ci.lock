# requirements-ci.lock — CI-only dependency lock (athenaeum#556)
#
# WHAT THIS IS: a constraints lock pinning the FULL transitive dependency tree
# resolved from `pip install -e ".[dev,vector]"`, so a green CI run at a given
# SHA is reproducible at that SHA tomorrow. Direct deps in pyproject.toml are
# range-pinned with deliberate upper bounds; their TRANSITIVE closure was
# entirely unpinned before this file, so CI drifted silently as new transitive
# releases shipped.
#
# WHAT THIS IS NOT: it does NOT change the published package's dependency
# ranges. pyproject.toml stays the single source of truth for what a CONSUMER
# installs (the deliberate upper bounds are unchanged). This lock only pins what
# CI installs, and is applied as a CONSTRAINTS file, not a requirements file:
#
#     pip install -e ".[dev,vector]" -c requirements-ci.lock
#
# pip still resolves the dependency graph from pyproject per Python version
# (3.11 / 3.12 / 3.13), then pins each package it installs to the version below.
# A constraint for a package not needed on a given interpreter (e.g. a backport
# behind a python_version marker) is simply ignored, so one lock serves the
# whole matrix.
#
# REGENERATE (from a clean venv on the lowest supported Python, 3.11):
#     python -m venv .venv && .venv/bin/pip install -e ".[dev,vector]"
#     .venv/bin/pip freeze --exclude-editable | sort -f > requirements-ci.lock
#     # then restore this header
#
# Dependabot proposes bumps against pyproject.toml's ranges (see
# .github/workflows/dependabot-auto-merge.yml and docs/security-posture.md
# §3.1); regenerate this lock when a dependency bump lands so CI tracks it.
